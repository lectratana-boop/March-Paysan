<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--bg4:#252550;--pri:#7c5cfc;--pri2:#9b7dff;--sec:#00cec9;--ok:#00b894;--warn:#fdcb6e;--err:#e17055;--txt:#e8e8ff;--txt2:#a0a0c0;--gold:#ffd700;--r:12px;--sh:0 4px 20px rgba(0,0,0,.4)}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;border-radius:var(--r);padding:10px 20px;font-size:14px;font-weight:600;transition:.3s}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
input,textarea,select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:12px 16px;color:var(--txt);font-size:14px;width:100%;margin-bottom:12px}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 10px rgba(124,92,252,.3)}
.bp{background:linear-gradient(135deg,var(--pri),#5a3fd4);color:#fff}
.bs{background:linear-gradient(135deg,var(--ok),#00a381);color:#fff}
.bd{background:linear-gradient(135deg,var(--err),#d63031);color:#fff}
.bw{background:linear-gradient(135deg,var(--warn),#f0b429);color:#222}
.bt{background:linear-gradient(135deg,var(--sec),#00a8a3);color:#fff}
.sm{padding:6px 14px;font-size:12px}
.xs{padding:4px 10px;font-size:11px}
.bk{width:100%;display:block}
.hidden{display:none!important}
.badge{background:var(--err);color:#fff;border-radius:50%;font-size:11px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:20px;margin-bottom:16px}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tp{background:rgba(253,203,110,.15);color:var(--warn)}
.ta{background:rgba(0,184,148,.15);color:var(--ok)}
.tr{background:rgba(225,112,85,.15);color:var(--err)}
.fx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tc{text-align:center}
.mt2{margin-top:16px}.mt3{margin-top:24px}.mb2{margin-bottom:16px}
.sd{color:var(--gold)}
label.fl{font-size:12px;color:var(--txt2);display:block;margin-bottom:4px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a,#1a1040,#0a0a1a);padding:16px}
.abox{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:32px;width:100%;max-width:400px;box-shadow:var(--sh)}
.abox h1{text-align:center;margin-bottom:6px;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:24px}
.abox .sub{text-align:center;color:var(--txt2);margin-bottom:18px;font-size:13px}
.atabs{display:flex;margin-bottom:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bg4)}
.atabs div{flex:1;padding:12px;text-align:center;background:var(--bg);color:var(--txt2);cursor:pointer;font-weight:600;font-size:14px;transition:.3s}
.atabs div.active{background:var(--pri);color:#fff}
.amsg{padding:14px;border-radius:var(--r);margin-bottom:14px;font-size:13px;text-align:center;line-height:1.6}
.amsg.ok{background:rgba(0,184,148,.15);color:var(--ok);border:1px solid rgba(0,184,148,.3)}
.amsg.err{background:rgba(225,112,85,.15);color:var(--err);border:1px solid rgba(225,112,85,.3)}
.amsg.warn{background:rgba(253,203,110,.15);color:var(--warn);border:1px solid rgba(253,203,110,.3)}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--bg4);padding:0 16px;position:sticky;top:0;z-index:100}
.hdr{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px;gap:6px}
.logo{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--txt2);padding:6px 10px;font-size:11px;border-radius:8px;position:relative;white-space:nowrap}
.nav button:hover{background:var(--bg3);color:var(--txt);transform:none}
.nav button.active{background:var(--pri);color:#fff}
.nav button .nb{position:absolute;top:-4px;right:-4px;font-size:8px;min-width:16px;height:16px;background:var(--err);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pls 1s infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.hr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;color:#fff}
.bell{position:relative;background:transparent;color:var(--txt2);font-size:18px;padding:6px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bell:hover{background:var(--bg3);color:var(--txt)}
.bell .badge{position:absolute;top:-4px;right:-4px;font-size:8px;min-width:16px;height:16px;animation:pls 1s infinite}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(20deg)}30%{transform:rotate(-20deg)}45%{transform:rotate(15deg)}60%{transform:rotate(-15deg)}75%{transform:rotate(5deg)}100%{transform:rotate(0)}}

/* URGENT NOTIF - IMPOSSIBLE TO MISS */
#urgentNotif{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9000;background:rgba(10,10,26,.92);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.urgent-box{background:var(--bg2);border:3px solid var(--gold);border-radius:20px;padding:30px;max-width:420px;width:90%;text-align:center;animation:popIn .4s ease;box-shadow:0 0 60px rgba(255,215,0,.3)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.urgent-icon{font-size:60px;color:var(--gold);margin-bottom:12px;animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.urgent-title{font-size:20px;font-weight:800;color:var(--gold);margin-bottom:8px}
.urgent-detail{color:var(--txt2);font-size:13px;margin-bottom:16px;line-height:1.5}

/* SMALL FLASH */
.nflash{position:fixed;top:70px;right:16px;background:var(--bg2);border:2px solid var(--gold);border-radius:var(--r);padding:14px 18px;box-shadow:0 8px 40px rgba(255,215,0,.25);z-index:300;animation:sIn .3s ease;max-width:340px;cursor:pointer}
@keyframes sIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes sOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}

/* NOTIF DROPDOWN */
.ndrop{position:absolute;top:calc(100% + 8px);right:-30px;width:320px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);box-shadow:var(--sh);z-index:200;max-height:480px;overflow-y:auto}
.ndrop h3{padding:12px 14px;border-bottom:1px solid var(--bg4);font-size:13px;margin:0}
.nitem{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:8px;align-items:flex-start;cursor:pointer;transition:.2s}
.nitem:hover{background:var(--bg3)}
.nico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.nico.or{background:rgba(253,203,110,.2);color:var(--warn)}
.nico.bl{background:rgba(124,92,252,.2);color:var(--pri2)}
.nico.rd{background:rgba(225,112,85,.2);color:var(--err)}
.nico.gn{background:rgba(0,184,148,.2);color:var(--ok)}
.ntxt{font-size:11px;line-height:1.4}.ntxt small{color:var(--txt2);display:block;margin-top:2px}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:20px}
.pgt{font-size:20px;font-weight:700;margin-bottom:4px}
.pgs{color:var(--txt2);font-size:12px;margin-bottom:20px}

/* STATS */
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stt{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:14px;text-align:center}
.stt .si{font-size:20px;margin-bottom:3px}.stt .sv{font-size:22px;font-weight:800}.stt .sl{color:var(--txt2);font-size:10px;margin-top:2px}

/* ADMIN TABS */
.ats{display:flex;gap:3px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--bg4);padding-bottom:6px}
.ats::-webkit-scrollbar{display:none}
.at{padding:8px 12px;border-radius:8px 8px 0 0;background:transparent;color:var(--txt2);font-size:11px;font-weight:600;white-space:nowrap}
.at:hover{background:var(--bg3);color:var(--txt);transform:none}
.at.active{background:var(--bg3);color:var(--pri2);border-bottom:2px solid var(--pri)}
.at .badge{margin-left:3px;font-size:8px;min-width:14px;height:14px}

/* TABLE */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bg4);font-size:11px}
th{color:var(--txt2);font-weight:600;background:var(--bg3);white-space:nowrap}

/* PRODUCTS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);overflow:hidden;transition:.3s}
.pc:hover{border-color:var(--pri);transform:translateY(-3px);box-shadow:var(--sh)}
.pimg{height:110px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--txt2);position:relative}
.pi{padding:12px}.pi h3{font-size:13px;margin-bottom:3px}.pi .pr{color:var(--sec);font-size:16px;font-weight:800;margin:4px 0}

/* FORUM */
.po{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:16px;margin-bottom:12px}
.cm{background:var(--bg3);border-radius:8px;padding:8px;margin:4px 0 4px 16px;border-left:3px solid var(--pri);font-size:12px}

/* PROFILE */
.prof{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:28px;text-align:center;max-width:500px;margin:0 auto}
.pav{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 10px;color:#fff}
.pbar{background:var(--bg);border-radius:20px;height:18px;overflow:hidden;margin:8px 0}
.pfill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pri),var(--gold));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;min-width:28px;color:#fff;transition:.5s}

/* ROULETTE */
#rlov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,26,.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rlw{position:relative;height:300px;overflow:hidden;border:2px solid var(--gold);border-radius:var(--r);background:var(--bg2);width:100%;max-width:360px;margin-bottom:14px}
.rlp{position:absolute;top:50%;left:0;right:0;height:50px;margin-top:-25px;background:rgba(255,215,0,.1);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);z-index:2;pointer-events:none}
.rln{position:absolute;top:0;left:0;right:0}.rlnm{height:50px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;border-bottom:1px solid var(--bg4)}
.rlnm.win{background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(124,92,252,.2));color:var(--gold);font-size:18px}
.rltm{background:var(--bg3);border-radius:var(--r);padding:12px;font-size:12px;color:var(--txt2);margin-bottom:10px}
.rltm .time{font-size:26px;font-weight:800;color:var(--sec);display:block;margin-top:4px;font-family:monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;z-index:10000;animation:confetti 3s ease-in-out forwards}
.wglow{animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 25px var(--gold)}}
.dbtn{background:linear-gradient(135deg,var(--gold),#ff6b6b);color:#000;font-size:15px;padding:12px 24px;border-radius:16px;font-weight:800;animation:pulse 2s infinite;margin:14px auto;display:block}

@media(max-width:768px){.sts{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:1fr}main{padding:12px}.abox{padding:20px}.ndrop{right:-80px;width:270px}.hdr{padding:0 4px}.logo{font-size:13px}.nav button{padding:5px 6px;font-size:9px}.nflash{right:8px;left:8px;max-width:none}.prof{padding:18px}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
</style>
</head>
<body>

<div id="auth">
<div class="abox">
<h1><i class="fas fa-store"></i> MadaMarket</h1>
<p class="sub">Marketplace Madagascar</p>
<div id="amsg"></div>
<div class="atabs">
<div class="active" onclick="aTab('login')">Connexion</div>
<div onclick="aTab('register')">Inscription</div>
</div>
<div id="f-login">
<label class="fl"><i class="fas fa-phone"></i> Téléphone</label>
<input type="tel" id="l-ph" placeholder="034 XX XXX XX">
<label class="fl"><i class="fas fa-lock"></i> Mot de passe</label>
<input type="password" id="l-pw" placeholder="Votre mot de passe">
<button class="bp bk" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Se Connecter</button>
</div>
<div id="f-reg" class="hidden">
<div style="background:var(--bg3);border-radius:var(--r);padding:12px;margin-bottom:14px;font-size:11px;color:var(--txt2);line-height:1.6">
<i class="fas fa-info-circle" style="color:var(--sec)"></i> <strong>3 étapes:</strong><br>
1️⃣ Remplissez ce formulaire<br>
2️⃣ L'admin reçoit une alerte instantanée et valide<br>
3️⃣ Connectez-vous avec téléphone + mot de passe
</div>
<label class="fl"><i class="fas fa-user"></i> Nom complet *</label>
<input id="r-nm" placeholder="Votre nom">
<label class="fl"><i class="fas fa-phone"></i> Téléphone *</label>
<input type="tel" id="r-ph" placeholder="034 XX XXX XX">
<label class="fl"><i class="fas fa-lock"></i> Mot de passe *</label>
<input type="password" id="r-pw" placeholder="Choisissez un mot de passe">
<label class="fl"><i class="fas fa-map-marker-alt"></i> Ville *</label>
<input id="r-ci" placeholder="Ex: Antananarivo">
<label class="fl"><i class="fas fa-home"></i> Quartier *</label>
<input id="r-qt" placeholder="Ex: Analakely">
<button class="bp bk" onclick="doReg()"><i class="fas fa-user-plus"></i> S'inscrire</button>
</div>
<div style="margin-top:14px;text-align:center;border-top:1px solid var(--bg4);padding-top:10px">
<button class="xs bd" onclick="resetAll()" style="opacity:.5;font-size:10px"><i class="fas fa-trash"></i> Réinitialiser</button>
</div>
</div>
</div>

<div id="app" class="hidden">
<header>
<div class="hdr">
<div class="logo"><i class="fas fa-store"></i> MadaMarket</div>
<div class="nav" id="nav"></div>
<div class="hr">
<div style="white-space:nowrap;font-size:11px"><i class="fas fa-star" style="color:var(--gold)"></i> <span id="hst">0</span></div>
<div style="position:relative" id="bw">
<button class="bell" id="bb" onclick="tglN()"><i class="fas fa-bell"></i><span class="badge hidden" id="bbg">0</span></button>
<div class="ndrop hidden" id="ndrop"></div>
</div>
<div class="av" id="hav">A</div>
<span id="hnm" style="font-size:11px"></span>
<button class="xs bd" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
</div>
</div>
</header>
<main id="ct"></main>
</div>

<div id="rlov" class="hidden">
<div style="text-align:center;width:100%;max-width:380px;padding:14px">
<div style="font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent"><i class="fas fa-trophy"></i> JACKPOT</div>
<div style="color:var(--txt2);margin-bottom:16px;font-size:13px">20⭐ à gagner!</div>
<div class="rlw"><div class="rlp"></div><div class="rln" id="rln"></div></div>
<div id="rlst" style="font-size:14px"></div>
</div>
</div>

<div id="flashBox"></div>
<div id="urgentBox"></div>

<script>
// ===== STORAGE =====
const D={
g(k){try{return JSON.parse(localStorage.getItem('mm_'+k))||[]}catch{return[]}},
s(k,v){localStorage.setItem('mm_'+k,JSON.stringify(v))},
gv(k){try{return JSON.parse(localStorage.getItem('mm_'+k))}catch{return null}},
sv(k,v){localStorage.setItem('mm_'+k,JSON.stringify(v))}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,6);
const fd=d=>d?new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const esc=s=>{if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const np=p=>(p||'').replace(/[\s\-\.]/g,'');
const ci=c=>({Électronique:'laptop',Vêtements:'tshirt',Maison:'home',Alimentation:'utensils',Services:'handshake'}[c]||'box');
const mdT=()=>{const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000)};

// ===== STATE =====
let U=null,pg='accueil',at='notifs',lastPC=-1;

// ===== SOUND =====
function playSound(type){
try{
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();
osc.connect(gain);gain.connect(ctx.destination);
gain.gain.value=0.3;
if(type==='alert'){
osc.frequency.value=800;osc.type='sine';
osc.start();osc.frequency.linearRampToValueAtTime(1200,ctx.currentTime+0.1);
osc.frequency.linearRampToValueAtTime(800,ctx.currentTime+0.2);
osc.frequency.linearRampToValueAtTime(1200,ctx.currentTime+0.3);
gain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.5);
osc.stop(ctx.currentTime+0.5);
}else{
osc.frequency.value=523;osc.type='sine';osc.start();
gain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.2);
osc.stop(ctx.currentTime+0.2);
}
}catch(e){}
}

// ===== INIT =====
function init(){
let u=D.g('users');
const ai=u.findIndex(x=>x.id==='admin001'||x.role==='admin');
const adm={id:'admin001',name:'Admin',phone:'0340000000',city:'Antananarivo',quartier:'Centre',password:'admin123',role:'admin',status:'approved',stars:0,isActive:true,withdrawReq:false,regAt:new Date().toISOString()};
if(ai>=0){u[ai].password='admin123';u[ai].phone='0340000000';u[ai].role='admin';u[ai].status='approved'}
else u.push(adm);
D.s('users',u);
['products','posts','comments','orders','rHist'].forEach(k=>{if(!localStorage.getItem('mm_'+k))D.s(k,[])});
}

function resetAll(){if(!confirm('⚠️ Supprimer TOUTES les données?'))return;Object.keys(localStorage).forEach(k=>{if(k.startsWith('mm_'))localStorage.removeItem(k)});location.reload()}

// ===== CROSS-TAB INSTANT NOTIFICATION =====
window.addEventListener('storage',function(e){
if(!e.key||!e.key.startsWith('mm_'))return;
if(!U||U.role!=='admin')return;

// Something changed in another tab! Check immediately
const p=pc();
if(p.total>lastPC&&lastPC>=0){
playSound('alert');
showUrgentNotif(p);
if(pg==='admin')render();
}
lastPC=p.total;
updateBadge();
buildNav();
});

// ===== ALSO POLL (backup for same-tab) =====
setInterval(()=>{
if(!U||U.role!=='admin')return;
const p=pc();
if(p.total!==lastPC){
if(p.total>lastPC&&lastPC>=0){
playSound('alert');
showUrgentNotif(p);
if(pg==='admin')render();
}
lastPC=p.total;
updateBadge();
buildNav();
}
},800);

// ===== URGENT NOTIFICATION =====
function showUrgentNotif(p){
let parts=[];
if(p.reg)parts.push(`👤 ${p.reg} inscription(s)`);
if(p.prod)parts.push(`📦 ${p.prod} produit(s)`);
if(p.cmt)parts.push(`💬 ${p.cmt} commentaire(s)`);
if(p.ord)parts.push(`🛒 ${p.ord} commande(s)`);

function uCD(){const n=mdT(),el=document.getElementById('rlcd');if(el)el.textContent=`${String(59-n.getMinutes()).padStart(2,'0')}:${String(59-n.getSeconds()).padStart(2,'0')}`}
setInterval(uCD,1000);
setInterval(()=>{const n=mdT();if(n.getMinutes()===0&&n.getSeconds()===0){const l=D.gv('lrl');if(l!==n.getHours()){D.sv('lrl',n.getHours());if(U)startRL()}}},1000);

let rlR=false;
function startRL(){
const us=D.g('users').filter(u=>u.role!=='admin'&&u.status==='approved');
if(us.length<1)return alert('Pas assez de membres!');if(rlR)return;rlR=true;
document.querySelectorAll('button').forEach(b=>b.disabled=true);
const w=us[Math.floor(Math.random()*us.length)];
const ov=document.getElementById('rlov'),nd=document.getElementById('rln'),st=document.getElementById('rlst');
ov.classList.remove('hidden');st.innerHTML='<i class="fas fa-spinner fa-spin"></i> Tirage...';
let nm=[];for(let i=0;i<80;i++)nm.push(us[i%us.length]);const wp=nm.length-6;nm[wp]=w;
nd.innerHTML=nm.map((u,i)=>`<div class="rlnm" data-i="${i}">${esc(u.name)}</div>`).join('');
const tgt=wp*50-125,st0=Date.now();
(function an(){const t=Math.min(1,(Date.now()-st0)/7000);nd.style.transform=`translateY(-${(1-Math.pow(1-t,3))*tgt}px)`;
if(t<1)requestAnimationFrame(an);
else setTimeout(()=>{nd.querySelector(`[data-i="${wp}"]`)?.classList.add('win');
st.innerHTML=`<div style="font-size:16px;color:var(--gold);font-weight:700;animation:pulse 1s infinite">🎉 ${esc(w.name)} gagne 20⭐! 🎉</div>`;
let all=D.g('users');let ww=all.find(u=>u.id===w.id);if(ww){ww.stars=(ww.stars||0)+20;D.s('users',all)}
if(U&&U.id===w.id)U.stars=(U.stars||0)+20;
let hi=D.g('rHist');hi.push({id:w.id,name:w.name,stars:20,time:new Date().toISOString()});D.s('rHist',hi);
cft();setTimeout(()=>{ov.classList.add('hidden');rlR=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render()},5000)},500)})();
}
function cft(){const c=['#ffd700','#7c5cfc','#00cec9','#e17055','#00b894','#fd79a8'];for(let i=0;i<50;i++){const e=document.createElement('div');e.className='confetti';e.style.cssText=`left:${Math.random()*100}vw;width:${5+Math.random()*10}px;height:${5+Math.random()*10}px;background:${c[Math.floor(Math.random()*c.length)]};border-radius:${Math.random()>.5?'50%':'0'};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s;`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

// ===== ADMIN =====
function rAdm(ct){
if(U.role!=='admin'){ct.innerHTML='Accès refusé';return}
const p=pc();
let h='<h1 class="pgt"><i class="fas fa-shield-alt"></i> Admin</h1><p class="pgs">Gestion</p>';
h+=`<div class="sts">
<div class="stt" ${p.reg?'style="border-color:var(--err);animation:pls 1s infinite"':''}><div class="si" style="color:var(--err)"><i class="fas fa-user-clock"></i></div><div class="sv" style="color:var(--err)">${p.reg}</div><div class="sl">Inscriptions</div></div>
<div class="stt"><div class="si" style="color:var(--pri2)"><i class="fas fa-box"></i></div><div class="sv" style="color:var(--pri2)">${p.prod}</div><div class="sl">Produits</div></div>
<div class="stt"><div class="si" style="color:var(--sec)"><i class="fas fa-shopping-cart"></i></div><div class="sv" style="color:var(--sec)">${p.ord}</div><div class="sl">Commandes</div></div>
<div class="stt"><div class="si" style="color:var(--gold)"><i class="fas fa-comment-dots"></i></div><div class="sv" style="color:var(--gold)">${p.cmt}</div><div class="sl">Commentaires</div></div>
<div class="stt"><div class="si" style="color:var(--ok)"><i class="fas fa-money-bill-wave"></i></div><div class="sv" style="color:var(--ok)">${p.wdr}</div><div class="sl">Retraits</div></div></div>`;
const tabs=[{id:'notifs',ic:'bell',lb:'Notif',b:p.total},{id:'inscriptions',ic:'user-clock',lb:'Inscrip.',b:p.reg},{id:'produits',ic:'box',lb:'Produits',b:p.prod},{id:'membres',ic:'users',lb:'Membres'},{id:'commandes',ic:'shopping-cart',lb:'Cmd',b:p.ord},{id:'forum',ic:'comments',lb:'Forum',b:p.cmt},{id:'etoiles',ic:'star',lb:'⭐',b:p.wdr}];
h+='<div class="ats">';tabs.forEach(t=>{h+=`<button class="at ${at===t.id?'active':''}" onclick="at='${t.id}';render()"><i class="fas fa-${t.ic}"></i> ${t.lb}`;if(t.b&&t.b>0)h+=`<span class="badge">${t.b}</span>`;h+='</button>'});h+='</div><div id="atc"></div>';
ct.innerHTML=h;
const ac=document.getElementById('atc');
({notifs:aN,inscriptions:aI,produits:aP,membres:aM,commandes:aO,forum:aF,etoiles:aS}[at]||aN)(ac);
}

function aN(el){
const p=pc();let h='<h2 class="mb2">🔔 Centre Notifications</h2>';
if(!p.total)h+='<div class="card tc" style="color:var(--ok);padding:30px"><i class="fas fa-check-circle" style="font-size:40px;display:block;margin-bottom:10px"></i>✅ Tout est à jour!</div>';
else{
if(p.reg)h+=nCard('user-clock','or',`${p.reg} inscription(s)`,'Valider maintenant','inscriptions','bw');
if(p.prod)h+=nCard('box','bl',`${p.prod} produit(s)`,'Approuver','produits','bp');
if(p.cmt)h+=nCard('comment-dots','rd',`${p.cmt} commentaire(s)`,'Modérer','forum','bd');
if(p.ord)h+=nCard('shopping-cart','gn',`${p.ord} commande(s)`,'Approuver','commandes','bt');
if(p.wdr)h+=nCard('money-bill-wave','or',`${p.wdr} retrait(s)`,'Valider','etoiles','bw');
}el.innerHTML=h;
}
function nCard(ic,col,txt,btn,tab,cls){return`<div class="card fb" style="border-left:4px solid var(--${col==='or'?'warn':col==='bl'?'pri':col==='rd'?'err':col==='gn'?'ok':'warn'})"><div class="fx"><div class="nico ${col}"><i class="fas fa-${ic}"></i></div><strong>${txt}</strong></div><button class="${cls} sm" onclick="at='${tab}';render()">${btn} →</button></div>`}

function aI(el){
const users=D.g('users').filter(u=>u.role!=='admin');const pend=users.filter(u=>u.status==='pending');
let h='<h2 class="mb2">👤 Inscriptions</h2>';
if(pend.length){
pend.forEach(u=>{h+=`<div class="card" style="border-left:4px solid var(--warn)">
<div class="fb mb2"><div class="fx"><div class="av">${u.name.charAt(0)}</div><div><strong>${esc(u.name)}</strong><div style="font-size:9px;color:var(--txt2)">${fd(u.regAt)}</div></div></div><span class="tag tp">⏳</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
<div class="card" style="margin:0;padding:8px"><div style="color:var(--txt2);font-size:9px">📱 Tél</div><div style="font-weight:700;color:var(--sec)">${esc(u.phone)}</div></div>
<div class="card" style="margin:0;padding:8px"><div style="color:var(--txt2);font-size:9px">🔑 MDP</div><div style="font-weight:700;color:var(--gold);font-family:monospace">${esc(u.password||'-')}</div></div>
<div class="card" style="margin:0;padding:8px"><div style="color:var(--txt2);font-size:9px">🏙️ Ville</div><div style="font-weight:700">${esc(u.city||'-')}</div></div>
<div class="card" style="margin:0;padding:8px"><div style="color:var(--txt2);font-size:9px">🏠 Quartier</div><div style="font-weight:700">${esc(u.quartier||'-')}</div></div></div>
<div class="fx"><button class="bs" onclick="valU('${u.id}')"><i class="fas fa-check-circle"></i> VALIDER CE MEMBRE</button><button class="bd sm" onclick="rejU('${u.id}')"><i class="fas fa-times"></i> Refuser</button></div></div>`});
}else h+='<div class="card tc" style="color:var(--ok);padding:20px">✅ Aucune inscription en attente</div>';
const done=users.filter(u=>u.status!=='pending');
if(done.length){h+='<h3 class="mt3 mb2">Traités</h3><div class="tw"><table><tr><th>Nom</th><th>Tél</th><th>Ville</th><th>Statut</th></tr>';done.forEach(u=>{h+=`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.city||'-')}</td><td><span class="tag ${u.status==='approved'?'ta':'tr'}">${u.status==='approved'?'✓':'✗'}</span></td></tr>`});h+='</table></div>'}
el.innerHTML=h;
}
function valU(uid){if(!confirm('Valider? Le membre pourra se connecter.'))return;let u=D.g('users');let x=u.find(a=>a.id===uid);if(x){x.status='approved';D.s('users',u);playSound('ok')}render()}
function rejU(uid){if(!confirm('Refuser?'))return;let u=D.g('users');let x=u.find(a=>a.id===uid);if(x){x.status='rejected';D.s('users',u)}render()}

function aP(el){
const prods=D.g('products'),users=D.g('users');const pend=prods.filter(p=>p.status==='pending'),appr=prods.filter(p=>p.status==='approved');
let h='<h2 class="mb2">📦 Produits</h2>';
if(pend.length){h+='<div class="tw"><table><tr><th>Produit</th><th>Vendeur</th><th>Tél</th><th>Prix</th><th>Cat.</th><th>Date</th><th>Actions</th></tr>';pend.forEach(p=>{const s=users.find(u=>u.id===p.userId);h+=`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(s?s.name:'?')}</td><td>${esc(s?s.phone:'?')}</td><td style="color:var(--sec);font-weight:700">${Number(p.price).toLocaleString()}</td><td>${esc(p.category||'-')}</td><td>${fd(p.createdAt)}</td><td class="fx"><button class="bs xs" onclick="vP('${p.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="rP('${p.id}')"><i class="fas fa-times"></i></button></td></tr>`});h+='</table></div>'}else h+='<div class="card tc" style="color:var(--txt2)">Aucun</div>';
h+=`<h3 class="mt3 mb2">Approuvés (${appr.length})</h3>`;
if(appr.length){h+='<div class="tw"><table><tr><th>Produit</th><th>Vendeur</th><th>Prix</th></tr>';appr.forEach(p=>{const s=users.find(u=>u.id===p.userId);h+=`<tr><td>${esc(p.name)}</td><td>${esc(s?s.name:'-')}</td><td>${Number(p.price).toLocaleString()}</td></tr>`});h+='</table></div>'}
el.innerHTML=h;
}
function vP(i){let p=D.g('products');let x=p.find(a=>a.id===i);if(x){x.status='approved';D.s('products',p)}render()}
function rP(i){if(!confirm('Refuser?'))return;let p=D.g('products');let x=p.find(a=>a.id===i);if(x){x.status='rejected';D.s('products',p)}render()}

function aM(el){
const users=D.g('users').filter(u=>u.role!=='admin');
let h='<h2 class="mb2">👥 Membres</h2><div class="card mb2"><input id="ms" placeholder="🔍 Rechercher..." oninput="fM()" style="margin:0"></div>';
h+='<div class="tw"><table><tr><th>#</th><th>Nom</th><th>Tél</th><th>MDP</th><th>Ville</th><th>Quartier</th><th>Statut</th><th>⭐</th><th>●</th></tr>';
users.forEach((u,i)=>{h+=`<tr class="mr" data-s="${(u.name+(u.phone||'')+(u.city||'')).toLowerCase()}"><td>${i+1}</td><td><strong>${esc(u.name)}</strong></td><td style="color:var(--sec)">${esc(u.phone||'-')}</td><td style="font-family:monospace;color:var(--warn);font-size:10px">${u.password||'-'}</td><td>${esc(u.city||'-')}</td><td>${esc(u.quartier||'-')}</td><td><span class="tag ${u.status==='approved'?'ta':u.status==='pending'?'tp':'tr'}">${u.status==='approved'?'✓':u.status==='pending'?'⏳':'✗'}</span></td><td class="sd">${u.stars||0}</td><td>${u.isActive?'<span style="color:var(--ok)">●</span>':'○'}</td></tr>`});
h+='</table></div>';el.innerHTML=h;
}
function fM(){const q=document.getElementById('ms').value.toLowerCase();document.querySelectorAll('.mr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')}

function aO(el){
const ords=D.g('orders'),users=D.g('users');const pend=ords.filter(o=>o.status==='pending'),appr=ords.filter(o=>o.status==='approved');
let h='<h2 class="mb2">🛒 Commandes</h2>';
if(pend.length){h+='<div class="tw"><table><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th><th>Date</th><th>Action</th></tr>';pend.forEach(o=>{const b=users.find(u=>u.id===o.buyerId),s=users.find(u=>u.id===o.sellerId);h+=`<tr><td><strong>${esc(o.productName)}</strong></td><td>${esc(b?b.name:'-')}<br><small style="color:var(--sec)">${esc(b?b.phone:'')}</small></td><td>${esc(s?s.name:'-')}<br><small style="color:var(--sec)">${esc(s?s.phone:'')}</small></td><td style="font-weight:700">${Number(o.price).toLocaleString()}</td><td>${fd(o.createdAt)}</td><td><button class="bs xs" onclick="vO('${o.id}')"><i class="fas fa-check"></i> Approuver</button></td></tr>`});h+='</table></div>'}else h+='<div class="card tc" style="color:var(--txt2)">Aucune</div>';
if(appr.length){h+=`<h3 class="mt3 mb2">Approuvées (${appr.length})</h3><div class="tw"><table><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th></tr>`;appr.forEach(o=>{const b=users.find(u=>u.id===o.buyerId),s=users.find(u=>u.id===o.sellerId);h+=`<tr><td>${esc(o.productName)}</td><td>${esc(b?b.name:'-')}</td><td>${esc(s?s.name:'-')}</td><td>${Number(o.price).toLocaleString()}</td></tr>`});h+='</table></div>'}
el.innerHTML=h;
}
function vO(oid){let o=D.g('orders');let x=o.find(a=>a.id===oid);if(!x)return;x.status='approved';D.s('orders',o);let p=D.g('products');let pr=p.find(a=>a.id===x.productId);if(pr){pr.status='sold';D.s('products',p)}let u=D.g('users');let se=u.find(a=>a.id===x.sellerId),bu=u.find(a=>a.id===x.buyerId);if(se)se.stars=(se.stars||0)+10;if(bu)bu.stars=(bu.stars||0)+5;D.s('users',u);render()}

function aF(el){
const cmts=D.g('comments'),posts=D.g('posts'),users=D.g('users');const pend=cmts.filter(c=>c.status==='pending'),appr=cmts.filter(c=>c.status==='approved');
let h='<h2 class="mb2">💬 Modération</h2>';
if(pend.length){pend.forEach(c=>{const a=users.find(u=>u.id===c.userId),p=posts.find(x=>x.id===c.postId);
h+=`<div class="card" style="border-left:4px solid var(--warn)"><div class="fb" style="margin-bottom:6px"><div class="fx"><div class="av" style="width:24px;height:24px;font-size:9px">${(a?a.name:'?').charAt(0)}</div><div><strong style="font-size:12px">${esc(a?a.name:'?')}</strong><div style="font-size:9px;color:var(--txt2)">sur "${esc(p?p.title:'?')}"</div></div></div><span style="font-size:9px;color:var(--txt2)">${fd(c.createdAt)}</span></div>
<div style="background:var(--bg3);padding:8px;border-radius:8px;margin:4px 0;font-size:12px">${esc(c.content)}</div>
<div class="fx"><button class="bs xs" onclick="vC('${c.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="dC('${c.id}')"><i class="fas fa-trash"></i></button></div></div>`})}
else h+='<div class="card tc" style="color:var(--ok)">✅ Tout modéré</div>';
if(appr.length){h+=`<h3 class="mt3 mb2">Approuvés (${appr.length})</h3><div class="tw"><table><tr><th>Auteur</th><th>Post</th><th>Texte</th></tr>`;appr.slice().reverse().slice(0,10).forEach(c=>{const a=users.find(u=>u.id===c.userId),p=posts.find(x=>x.id===c.postId);h+=`<tr><td>${esc(a?a.name:'-')}</td><td>${esc(p?p.title:'-')}</td><td style="max-width:150px">${esc(c.content)}</td></tr>`});h+='</table></div>'}
el.innerHTML=h;
}
function vC(cid){let c=D.g('comments');let x=c.find(a=>a.id===cid);if(x){x.status='approved';let u=D.g('users');let au=u.find(a=>a.id===x.userId);if(au){au.stars=(au.stars||0)+1;D.s('users',u)}}D.s('comments',c);render()}
function dC(cid){if(!confirm('Supprimer?'))return;let c=D.g('comments');c=c.filter(x=>x.id!==cid);D.s('comments',c);render()}

function aS(el){
const users=D.g('users').filter(u=>u.role!=='admin');const sorted=[...users].sort((a,b)=>(b.stars||0)-(a.stars||0));const wdrs=users.filter(u=>u.withdrawReq);
let h='<h2 class="mb2">⭐ Étoiles</h2>';
if(wdrs.length){h+='<h3 class="mb2">💰 Retraits</h3>';wdrs.forEach(u=>{h+=`<div class="card fb" style="border-left:4px solid var(--gold)"><div class="fx"><div class="av">${u.name.charAt(0)}</div><div><strong>${esc(u.name)}</strong><div style="font-size:10px;color:var(--txt2)">${esc(u.phone)}</div><div class="sd">${u.stars||0}⭐</div></div></div><div class="fx"><button class="bs sm" onclick="vW('${u.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="rW('${u.id}')"><i class="fas fa-times"></i></button></div></div>`})}
h+='<h3 class="mt3 mb2">Classement</h3><div class="tw"><table><tr><th>#</th><th>Membre</th><th>⭐</th><th>%</th></tr>';
sorted.forEach((u,i)=>{const pct=Math.min(100,((u.stars||0)/1000)*100);h+=`<tr><td style="font-weight:700">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td><strong>${esc(u.name)}</strong></td><td class="sd" style="font-weight:700">${u.stars||0}</td><td><div class="pbar" style="height:10px;width:80px;display:inline-block;margin:0"><div class="pfill" style="width:${pct}%;font-size:7px">${Math.round(pct)}%</div></div></td></tr>`});
h+='</table></div>';el.innerHTML=h;
}
function vW(uid){if(!confirm('Valider retrait? ⭐→0'))return;let u=D.g('users');let x=u.find(a=>a.id===uid);if(x){x.stars=0;x.withdrawReq=false;D.s('users',u)}render()}
function rW(uid){let u=D.g('users');let x=u.find(a=>a.id===uid);if(x){x.withdrawReq=false;D.s('users',u)}render()}

// ===== BOOT =====
init();restore();
</script>
</body>
</html>
