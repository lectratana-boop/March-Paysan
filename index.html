<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadaMarket - Marketplace Madagascar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        :root {
            --primary: #7c5cfc;
            --secondary: #00cec9;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --gold: #ffd700;
            --bg: #0a0a1a;
            --card: #12122a;
            --border: #2a2a4a;
        }

        #adminAlert {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(90deg, #e17055, #fdcb6e, #e17055);
            background-size: 200% 100%;
            animation: gradientScroll 2s linear infinite;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            display: none;
            color: #000;
            box-shadow: 0 4px 12px rgba(225, 112, 85, 0.6);
        }

        #adminAlert.show {
            display: block;
        }

        @keyframes gradientScroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 70px;
        }

        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(124, 92, 252, 0.2);
        }

        .login-card h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 32px;
        }

        .login-card h2 {
            color: var(--secondary);
            margin-bottom: 32px;
            font-size: 18px;
            font-weight: normal;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #6a4ada;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 92, 252, 0.4);
        }

        .btn-secondary {
            background: var(--danger);
            color: white;
        }

        .btn-secondary:hover {
            background: #d35d47;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #00a077;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        .btn-warning {
            background: var(--warning);
            color: #000;
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            width: auto;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 12px 20px;
        }

        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav .logo {
            color: var(--primary);
            font-size: 20px;
            font-weight: bold;
        }

        nav .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav .nav-link {
            padding: 8px 16px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 14px;
            position: relative;
        }

        nav .nav-link:hover {
            background: var(--bg);
            color: white;
        }

        nav .nav-link.active {
            background: var(--primary);
            color: white;
        }

        nav .nav-link .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        nav .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        nav .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        nav .logout-btn {
            padding: 6px 12px;
            background: var(--danger);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(124, 92, 252, 0.2);
        }

        .stat-card .icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .stat-card .icon.primary { background: rgba(124, 92, 252, 0.2); color: var(--primary); }
        .stat-card .icon.success { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .stat-card .icon.warning { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .stat-card .icon.secondary { background: rgba(0, 206, 201, 0.2); color: var(--secondary); }

        .stat-card .info h3 {
            font-size: 32px;
            color: white;
            margin-bottom: 4px;
        }

        .stat-card .info p {
            color: #888;
            font-size: 14px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(124, 92, 252, 0.15);
        }

        .card .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(124, 92, 252, 0.2);
            color: var(--primary);
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: white;
        }

        .card .price {
            font-size: 24px;
            font-weight: bold;
            color: var(--success);
            margin: 12px 0;
        }

        .card .seller {
            color: #888;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .card .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .tag.pending { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .tag.approved { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .tag.sold { background: rgba(128, 128, 128, 0.2); color: #888; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-header h2 {
            font-size: 28px;
            color: white;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 24px;
            color: white;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }

        .table-container {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(124, 92, 252, 0.1);
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        td {
            color: #e0e0e0;
            font-size: 14px;
        }

        tr:hover {
            background: rgba(124, 92, 252, 0.05);
        }

        .post {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .post-header .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .post-author {
            flex: 1;
        }

        .post-author h4 {
            color: white;
            margin-bottom: 4px;
        }

        .post-author .date {
            color: #888;
            font-size: 12px;
        }

        .post-title {
            font-size: 22px;
            color: white;
            margin-bottom: 12px;
        }

        .post-content {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .comments {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .comment {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(124, 92, 252, 0.05);
            border-radius: 8px;
        }

        .comment.pending {
            opacity: 0.5;
        }

        .comment .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .comment-author {
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .comment-text {
            color: #ccc;
            font-size: 14px;
        }

        .profile-header {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        .profile-header .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            margin: 0 auto 16px;
        }

        .profile-header h2 {
            color: white;
            margin-bottom: 8px;
        }

        .profile-header .role {
            color: var(--secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            text-align: left;
        }

        .profile-info .info-item {
            padding: 12px;
            background: rgba(124, 92, 252, 0.1);
            border-radius: 8px;
        }

        .profile-info .info-item label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .profile-info .info-item .value {
            color: white;
            font-size: 15px;
            font-weight: 500;
        }

        .stars-section {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 32px;
            margin-bottom: 24px;
        }

        .stars-big {
            font-size: 72px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--warning));
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .progress-text {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .btn-glow {
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px var(--gold); }
            50% { box-shadow: 0 0 40px var(--gold), 0 0 60px var(--gold); }
        }

        .wheel-container {
            text-align: center;
            padding: 20px;
        }

        .countdown {
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 32px;
            font-weight: bold;
        }

        .wheel-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 32px;
        }

        #wheelCanvas {
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--gold);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            z-index: 10;
        }

        .btn-spin {
            font-size: 24px;
            padding: 16px 48px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-spin:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.5);
        }

        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-spin.pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .wheel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .wheel-overlay.show {
            display: flex;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 400;
            pointer-events: none;
        }

        .history-section {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-top: 32px;
        }

        .history-section h3 {
            margin-bottom: 16px;
            color: white;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .admin-tab {
            padding: 10px 20px;
            background: var(--bg);
            border: none;
            border-radius: 8px;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
        }

        .admin-tab:hover {
            background: rgba(124, 92, 252, 0.2);
            color: white;
        }

        .admin-tab.active {
            background: var(--primary);
            color: white;
        }

        .admin-tab .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .notif-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .notif-card:hover {
            transform: translateX(4px);
            border-color: var(--primary);
        }

        .notif-card .icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(253, 203, 110, 0.2);
            color: var(--warning);
        }

        .notif-card .info {
            flex: 1;
        }

        .notif-card .info h3 {
            color: white;
            margin-bottom: 4px;
        }

        .notif-card .info p {
            color: #888;
            font-size: 13px;
        }

        .reg-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 20px;
        }

        .reg-card .user-name {
            font-size: 20px;
            color: white;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .reg-card .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .reg-card .info-item {
            padding: 12px;
            background: rgba(124, 92, 252, 0.1);
            border-radius: 8px;
        }

        .reg-card .info-item label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .reg-card .info-item .value {
            color: white;
            font-size: 15px;
        }

        .reg-card .info-item .value.password {
            font-family: 'Courier New', monospace;
            color: var(--gold);
            font-weight: bold;
        }

        .reg-card .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.warning {
            background: rgba(253, 203, 110, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--card);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .leaderboard-item .rank {
            font-size: 24px;
            font-weight: bold;
            width: 40px;
            text-align: center;
        }

        .leaderboard-item .medal {
            font-size: 32px;
        }

        .leaderboard-item .info {
            flex: 1;
        }

        .leaderboard-item .name {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .leaderboard-item .stars {
            color: var(--gold);
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            nav .nav-links {
                width: 100%;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .reg-card .info-grid {
                grid-template-columns: 1fr;
            }

            .admin-tabs {
                overflow-x: auto;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        .mb-16 { margin-bottom: 16px; }
        .mb-24 { margin-bottom: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: #888; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="adminAlert"></div>

    <div id="loginPage">
        <div class="login-card">
            <h1>🛍️ MadaMarket</h1>
            <h2>Marketplace Madagascar</h2>
            
            <div class="tabs">
                <button class="tab active" data-tab="login">Connexion</button>
                <button class="tab" data-tab="register">Inscription</button>
            </div>

            <form id="loginForm">
                <div class
="form-group">
                    <label>📱 Téléphone</label>
                    <input type="tel" id="loginPhone" required placeholder="0340000000">
                </div>
                <div class="form-group">
                    <label>🔒 Mot de passe</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Connexion</button>
            </form>

            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label>👤 Nom complet *</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>📱 Téléphone *</label>
                    <input type="tel" id="regPhone" required placeholder="0340000000">
                </div>
                <div class="form-group">
                    <label>🔒 Mot de passe *</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label>🏙️ Ville *</label>
                    <input type="text" id="regCity" required>
                </div>
                <div class="form-group">
                    <label>📍 Quartier *</label>
                    <input type="text" id="regQuartier" required>
                </div>
                <button type="submit" class="btn btn-success">S'inscrire</button>
            </form>

            <button class="btn btn-secondary" id="resetBtn">🔄 Réinitialiser le site</button>
        </div>
    </div>

    <nav id="mainNav" class="hidden">
        <div class="nav-container">
            <div class="logo">🛍️ MadaMarket</div>
            <div class="nav-links" id="navLinks"></div>
            <div class="user-info">
                <div class="avatar" id="navAvatar"></div>
                <button class="logout-btn" id="logoutBtn">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div id="app" class="hidden"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="wheelOverlay" class="wheel-overlay">
        <div id="overlayWheelContent"></div>
    </div>

    <script>
        // GLOBALS
        let currentUser = null;
        let currentPage = 'home';
        let currentAdminTab = 'notifications';
        let audioCtx = null;
        let lastTotal = 0;
        let wheelCanvas, wheelCtx;
        let wheelSpinning = false;
        let wheelRotation = 0;
        let wheelParticipants = [];
        let lastWheelTime = 0;

        // STORAGE HELPERS
        function getUsers() {
            return JSON.parse(localStorage.getItem('u') || '[]');
        }
        function setUsers(users) {
            localStorage.setItem('u', JSON.stringify(users));
        }
        function getProducts() {
            return JSON.parse(localStorage.getItem('p') || '[]');
        }
        function setProducts(products) {
            localStorage.setItem('p', JSON.stringify(products));
        }
        function getPosts() {
            return JSON.parse(localStorage.getItem('po') || '[]');
        }
        function setPosts(posts) {
            localStorage.setItem('po', JSON.stringify(posts));
        }
        function getComments() {
            return JSON.parse(localStorage.getItem('c') || '[]');
        }
        function setComments(comments) {
            localStorage.setItem('c', JSON.stringify(comments));
        }
        function getOrders() {
            return JSON.parse(localStorage.getItem('o') || '[]');
        }
        function setOrders(orders) {
            localStorage.setItem('o', JSON.stringify(orders));
        }
        function getHistory() {
            return JSON.parse(localStorage.getItem('h') || '[]');
        }
        function setHistory(history) {
            localStorage.setItem('h', JSON.stringify(history));
        }

        // PENDING COUNTER (DIRECT READ)
        function pending() {
            const users = JSON.parse(localStorage.getItem('u') || '[]');
            const products = JSON.parse(localStorage.getItem('p') || '[]');
            const comments = JSON.parse(localStorage.getItem('c') || '[]');
            const orders = JSON.parse(localStorage.getItem('o') || '[]');
            
            const reg = users.filter(u => u.status === 'pending').length;
            const prod = products.filter(p => p.status === 'pending').length;
            const cmt = comments.filter(c => c.status === 'pending').length;
            const ord = orders.filter(o => o.status === 'pending').length;
            
            return {
                reg, prod, cmt, ord, ban: 0,
                total: reg + prod + cmt + ord
            };
        }

        // AUDIO
        function beep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function tick() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 600;
                gain.gain.value = 0.1;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        // POLLING
        function startPolling() {
            setInterval(() => {
                const p = pending();
                if (p.total !== lastTotal) {
                    lastTotal = p.total;
                    if (currentUser && currentUser.role === 'admin') {
                        beep();
                        draw();
                    }
                }
                updateAdminAlert();
            }, 300);

            window.addEventListener('storage', () => {
                if (currentUser && currentUser.role === 'admin') {
                    draw();
                }
            });
        }

        // ADMIN ALERT BAR
        function updateAdminAlert() {
            const alert = document.getElementById('adminAlert');
            if (!currentUser || currentUser.role !== 'admin') {
                alert.classList.remove('show');
                return;
            }
            const p = pending();
            if (p.total > 0) {
                alert.innerHTML = `⚠️ ${p.total} action(s) en attente - Cliquez ici pour gérer`;
                alert.classList.add('show');
            } else {
                alert.classList.remove('show');
            }
        }

        // UTILITIES
        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function getCategoryIcon(cat) {
            const icons = {
                'Électronique': 'fa-laptop',
                'Vêtements': 'fa-tshirt',
                'Maison': 'fa-home',
                'Alimentation': 'fa-utensils',
                'Services': 'fa-handshake',
                'Autre': 'fa-box'
            };
            return icons[cat] || 'fa-box';
        }

        // INIT
        function init() {
            // Seed admin
            let users = getUsers();
            if (!users.find(u => u.phone === '0340000000')) {
                users.push({
                    id: Date.now(),
                    name: 'Administrateur',
                    phone: '0340000000',
                    password: 'admin123',
                    city: 'Antananarivo',
                    quartier: 'Centre',
                    role: 'admin',
                    status: 'approved',
                    stars: 0,
                    ban: false,
                    regAt: Date.now()
                });
                setUsers(users);
            }

            // Restore session
            const sessionId = localStorage.getItem('session');
            if (sessionId) {
                currentUser = users.find(u => u.id == sessionId);
                if (currentUser && currentUser.status === 'approved' && !currentUser.ban) {
                    showApp();
                } else {
                    localStorage.removeItem('session');
                    currentUser = null;
                }
            }

            // Start polling
            startPolling();

            // Check wheel auto
            setInterval(checkWheelAuto, 5000);

            // EVENT LISTENERS
            setupEventListeners();
        }

        function setupEventListeners() {
            // Auth tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const tabName = this.getAttribute('data-tab');
                    if (tabName === 'login') {
                        document.getElementById('loginForm').classList.remove('hidden');
                        document.getElementById('registerForm').classList.add('hidden');
                    } else {
                        document.getElementById('loginForm').classList.add('hidden');
                        document.getElementById('registerForm').classList.remove('hidden');
                    }
                });
            });

            // Login form
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const phone = document.getElementById('loginPhone').value;
                const password = document.getElementById('loginPassword').value;
                
                const users = getUsers();
                const user = users.find(u => u.phone === phone && u.password === password);
                
                if (!user) {
                    alert('❌ Téléphone ou mot de passe incorrect');
                    return;
                }
                if (user.ban) {
                    alert('🚫 Compte banni. Contactez l\'administration.');
                    return;
                }
                if (user.status === 'pending') {
                    alert('⏳ Votre compte est en attente de validation par l\'administrateur.');
                    return;
                }
                if (user.status === 'rejected') {
                    alert('❌ Votre compte a été refusé.');
                    return;
                }
                
                currentUser = user;
                localStorage.setItem('session', user.id);
                showApp();
            });

            // Register form
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('regName').value;
                const phone = document.getElementById('regPhone').value;
                const password = document.getElementById('regPassword').value;
                const city = document.getElementById('regCity').value;
                const quartier = document.getElementById('regQuartier').value;
                
                const users = getUsers();
                if (users.find(u => u.phone === phone)) {
                    alert('❌ Ce numéro de téléphone est déjà utilisé');
                    return;
                }
                
                users.push({
                    id: Date.now(),
                    name, phone, password, city, quartier,
                    role: 'user',
                    status: 'pending',
                    stars: 0,
                    ban: false,
                    regAt: Date.now()
                });
                setUsers(users);
                
                alert('✅ Inscription réussie ! Votre compte est en attente de validation par l\'administrateur.');
                document.getElementById('registerForm').reset();
                document.querySelector('.tab[data-tab="login"]').click();
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                if (confirm('⚠️ Voulez-vous vraiment réinitialiser tout le site ? Toutes les données seront perdues.')) {
                    localStorage.clear();
                    location.reload();
                }
            });

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.removeItem('session');
                currentUser = null;
                currentPage = 'home';
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('mainNav').classList.add('hidden');
                document.getElementById('app').classList.add('hidden');
            });

            // Modal close
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // Admin alert click
            document.getElementById('adminAlert').addEventListener('click', function() {
                currentPage = 'admin';
                currentAdminTab = 'notifications';
                draw();
            });
        }

        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainNav').classList.remove('hidden');
            document.getElementById('app').classList.remove('hidden');
            draw();
        }

        // NAVIGATION
        window.navigateTo = function(page) {
            currentPage = page;
            draw();
        };

        window.switchAdminTab = function(tab) {
            currentAdminTab = tab;
            draw();
        };

        // DRAW
        function draw() {
            if (!currentUser) return;
            
            // Update nav
            const p = pending();
            const isAdmin = currentUser.role === 'admin';
            
            let navLinks = '';
            const pages = [
                { id: 'home', label: 'Accueil', icon: 'fa-home' },
                { id: 'products', label: 'Produits', icon: 'fa-store' },
                { id: 'forum', label: 'Forum', icon: 'fa-comments' },
                { id: 'profile', label: 'Profil', icon: 'fa-user' },
                { id: 'wheel', label: 'Mega Wheel', icon: 'fa-circle-notch' }
            ];
            
            if (isAdmin) {
                pages.push({ id: 'admin', label: 'Admin', icon: 'fa-shield-alt', badge: p.total > 0 });
            }
            
            pages.forEach(pg => {
                const active = currentPage === pg.id ? 'active' : '';
                const badge = pg.badge ? '<span class="badge"></span>' : '';
                navLinks += `<button class="nav-link ${active}" onclick="navigateTo('${pg.id}')">
                    <i class="fas ${pg.icon}"></i> ${pg.label} ${badge}
                </button>`;
            });
            
            document.getElementById('navLinks').innerHTML = navLinks;
            document.getElementById('navAvatar').textContent = currentUser.name[0].toUpperCase();
            
            // Update page content
            const app = document.getElementById('app');
            
            if (currentPage === 'home') {
                app.innerHTML = drawHome();
            } else if (currentPage === 'products') {
                app.innerHTML = drawProducts();
            } else if (currentPage === 'forum') {
                app.innerHTML = drawForum();
            } else if (currentPage === 'profile') {
                app.innerHTML = drawProfile();
            } else if (currentPage === 'wheel') {
                app.innerHTML = drawWheel();
                setTimeout(initWheel, 100);
            } else if (currentPage === 'admin') {
                app.innerHTML = drawAdmin();
            }
            
            updateAdminAlert();
        }

        // HOME PAGE
        function drawHome() {
            const users = getUsers();
            const products = getProducts();
            const orders = getOrders();
            const isAdmin = currentUser.role === 'admin';
            const p = pending();
            
            let stats = '';
            if (isAdmin) {
                stats = `
                    <div class="stat-card">
                        <div class="icon warning"><i class="fas fa-user-clock"></i></div>
                        <div class="info"><h3>${p.reg}</h3><p>Inscriptions en attente</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon warning"><i class="fas fa-box"></i></div>
                        <div class="info"><h3>${p.prod}</h3><p>Produits en attente</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon primary"><i class="fas fa-users"></i></div>
                        <div class="info"><h3>${users.filter(u => u.status === 'approved').length}</h3><p>Membres total</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon warning"><i class="fas fa-shopping-cart"></i></div>
                        <div class="info"><h3>${p.ord}</h3><p>Commandes en attente</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon warning"><i class="fas fa-comment"></i></div>
                        <div class="info"><h3>${p.cmt}</h3><p>Commentaires en attente</p></div>
                    </div>
                `;
            } else {
                const myProducts = products.filter(pr => pr.userId === currentUser.id);
                const myOrders = orders.filter(o => o.buyerId === currentUser.id);
                const availableProducts = products.filter(pr => pr.status === 'approved' && pr.userId !== currentUser.id);
                
                stats = `
                    <div class="stat-card">
                        <div class="icon primary"><i class="fas fa-box"></i></div>
                        <div class="info"><h3>${myProducts.length}</h3><p>Mes produits</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon secondary"><i class="fas fa-shopping-cart"></i></div>
                        <div class="info"><h3>${myOrders.length}</h3><p>Mes commandes</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon warning"><i class="fas fa-star"></i></div>
                        <div class="info"><h3>${currentUser.stars}</h3><p>Étoiles</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="icon success"><i class="fas fa-store"></i></div>
                        <div class="info"><h3>${availableProducts.length}</h3><p>Produits disponibles</p></div>
                    </div>
                `;
            }
            
            const recentProducts = products
                .filter(p => p.status === 'approved')
                .sort((a, b) => b.createdAt - a.createdAt)
                .slice(0, 4);
            
            let productsHtml = '';
            recentProducts.forEach(product => {
                const seller = users.find(u => u.id === product.userId);
                const icon = getCategoryIcon(product.category);
                productsHtml += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon"><i class="fas ${icon}"></i></div>
                            <div>
                                <h3>${esc(product.name)}</h3>
                                <span class="tag ${product.status}">${product.status === 'sold' ? '✅ Vendu' : '🟢 Disponible'}</span>
                            </div>
                        </div>
                        <div class="price">${product.price.toLocaleString()} Ar</div>
                        <div class="seller">Vendeur: ${esc(seller?.name || 'Inconnu')}</div>
                        ${product.userId !== currentUser.id && product.status === 'approved' ? 
                            `<button class="btn btn-success" onclick="buyProduct(${product.id})">🛒 Acheter</button>` : ''}
                    </div>
                `;
            });
            
            return `
                <div class="stats-grid">${stats}</div>
                <div class="section-header"><h2>Produits récents</h2></div>
                <div class="cards-grid">${productsHtml || '<p class="text-muted">Aucun produit disponible</p>'}</div>
            `;
        }

        // PRODUCTS PAGE
        function drawProducts() {
            const products = getProducts();
            const users = getUsers();
            const myProducts = products.filter(p => p.userId === currentUser.id);
            const otherProducts = products.filter(p => p.userId !== currentUser.id && p.status === 'approved');
            
            let html = `
                <div class="section-header">
                    <h2>Marketplace</h2>
                    <button class="btn btn-primary" onclick="showAddProduct()">➕ Ajouter un produit</button>
                </div>
            `;
            
            if (myProducts.length > 0) {
                html += `<h3 class="mb-16">Mes produits</h3><div class="cards-grid">`;
                myProducts.forEach(product => {
                    const icon = getCategoryIcon(product.category);
                    let statusTag = '';
                    if (product.status === 'pending') statusTag = '<span class="tag pending">⏳ En attente</span>';
                    else if (product.status === 'approved') statusTag = '<span class="tag approved">✅ Approuvé</span>';
                    else if (product.status === 'sold') statusTag = '<span class="tag sold">✅ Vendu</span>';
                    
                    html += `
                        <div class="card">
                            <div class="card-header">
                                <div class="card-icon"><i class="fas ${icon}"></i></div>
                                <div><h3>${esc(product.name)}</h3>${statusTag}</div>
                            </div>
                            <p class="text-muted">${esc(product.description)}</p>
                            <div class="price">${product.price.toLocaleString()} Ar</div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            html += `<h3 class="mb-16" style="margin-top: 32px;">Produits disponibles</h3><div class="cards-grid">`;
            otherProducts.forEach(product => {
                const seller = users.find(u => u.id === product.userId);
                const icon = getCategoryIcon(product.category);
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon"><i class="fas ${icon}"></i></div>
                            <div><h3>${esc(product.name)}</h3><span class="tag approved">🟢 Disponible</span></div>
                        </div>
                        <p class="text-muted">${esc(product.description)}</p>
                        <div class="price">${product.price.toLocaleString()} Ar</div>
                        <div class="seller">Vendeur: ${esc(seller?.name || 'Inconnu')}</div>
                        <button class="btn btn-success" onclick="buyProduct(${product.id})">🛒 Acheter</button>
                    </div>
                `;
            });
            html += '</div>';
            
            if (otherProducts.length === 0) {
                html += '<p class="text-muted">Aucun produit disponible</p>';
            }
            
            return html;
        }

        window.showAddProduct = function() {
            document.getElementById('modalBody').innerHTML = `
                <h2>Ajouter un produit</h2>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Nom du produit *</label>
                        <input type="text" id="prodName" required>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="prodDesc" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Prix (Ariary) *</label>
                        <input type="number" id="prodPrice" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Catégorie *</label>
                        <select id="prodCat" required>
                            <option>Électronique</option>
                            <option>Vêtements</option>
                            <option>Maison</option>
                            <option>Alimentation</option>
                            <option>Services</option>
                            <option>Autre</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Publier</button>
                </form>
            `;
            document.getElementById('modal').classList.add('show');
            
            document.getElementById('addProductForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const products = getProducts();
                products.push({
                    id: Date.now(),
                    userId: currentUser.id,
                    name: document.getElementById('prodName').value,
                    description: document.getElementById('prodDesc').value,
                    price: parseInt(document.getElementById('prodPrice').value),
                    category: document.getElementById('prodCat').value,
                    status: 'pending',
                    createdAt: Date.now()
                });
                setProducts(products);
                closeModal();
                draw();
                alert('✅ Produit ajouté ! En attente de validation.');
            });
        };

        window.buyProduct = function(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (!product || product.status !== 'approved') {
                alert('❌ Ce produit n\'est plus disponible');
                return;
            }
            
            if (confirm(`Confirmer l'achat de "${product.name}" pour ${product.price.toLocaleString()} Ar ?`)) {
                const orders = getOrders();
                orders.push({
                    id: Date.now(),
                    productId: product.id,
                    buyerId: currentUser.id,
                    sellerId: product.userId,
                    productName: product.name,
                    price: product.price,
                    status: 'pending',
                    createdAt: Date.now()
                });
                setOrders(orders);
                alert('✅ Commande créée ! En attente de validation.');
                draw();
            }
        };

        // FORUM PAGE
        function drawForum() {
            const posts = getPosts().sort((a, b) => b.createdAt - a.createdAt);
            const comments = getComments();
            const users = getUsers();
            
            let html = `
                <div class="section-header">
                    <h2>Forum</h2>
                    <button class="btn btn-primary" onclick="showNewPost()">➕ Nouveau post</button>
                </div>
            `;
            
            posts.forEach(post => {
                const author = users.find(u => u.id === post.userId);

        function initWheel() {
            wheelCanvas = document.getElementById('wheelCanvas');
            if (!wheelCanvas) return;
            wheelCtx = wheelCanvas.getContext('2d');
            
            const users = getUsers().filter(u => u.status === 'approved' && !u.ban);
            wheelParticipants = users;
            
            drawWheelCanvas();
            
            setInterval(() => {
                if (wheelSpinning) return;
                const nextHour = getNextHour();
                const now = Date.now();
                const diff = nextHour - now;
                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                const cd = document.getElementById('countdown');
                if (cd) {
                    cd.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function drawWheelCanvas() {
            if (!wheelCtx || wheelParticipants.length === 0) return;
            
            const centerX = 250;
            const centerY = 250;
            const radius = 220;
            const segmentAngle = (Math.PI * 2) / wheelParticipants.length;
            
            wheelCtx.clearRect(0, 0, 500, 500);
            
            wheelParticipants.forEach((user, i) => {
                const startAngle = i * segmentAngle + wheelRotation;
                const endAngle = (i + 1) * segmentAngle + wheelRotation;
                
                const colors = ['#7c5cfc', '#00cec9', '#00b894', '#fdcb6e', '#e17055', '#6c5ce7', '#a29bfe'];
                wheelCtx.fillStyle = colors[i % colors.length];
                
                wheelCtx.beginPath();
                wheelCtx.moveTo(centerX, centerY);
                wheelCtx.arc(centerX, centerY, radius, startAngle, endAngle);
                wheelCtx.closePath();
                wheelCtx.fill();
                wheelCtx.strokeStyle = '#000';
                wheelCtx.lineWidth = 2;
                wheelCtx.stroke();
                
                wheelCtx.save();
                wheelCtx.translate(centerX, centerY);
                wheelCtx.rotate(startAngle + segmentAngle / 2);
                wheelCtx.textAlign = 'center';
                wheelCtx.fillStyle = '#fff';
                wheelCtx.font = 'bold 14px Segoe UI';
                wheelCtx.fillText(user.name.substring(0, 15), radius * 0.7, 5);
                wheelCtx.restore();
            });
            
            const ledCount = 24;
            for (let i = 0; i < ledCount; i++) {
                const angle = (i / ledCount) * Math.PI * 2 + wheelRotation * 0.5;
                const x = centerX + Math.cos(angle) * (radius + 15);
                const y = centerY + Math.sin(angle) * (radius + 15);
                
                wheelCtx.beginPath();
                wheelCtx.arc(x, y, 5, 0, Math.PI * 2);
                wheelCtx.fillStyle = (Date.now() + i * 100) % 1000 < 500 ? '#ffd700' : '#444';
                wheelCtx.fill();
            }
            
            wheelCtx.beginPath();
            wheelCtx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            wheelCtx.fillStyle = '#ffd700';
            wheelCtx.fill();
            wheelCtx.strokeStyle = '#000';
            wheelCtx.lineWidth = 3;
            wheelCtx.stroke();
            
            wheelCtx.fillStyle = '#000';
            wheelCtx.font = 'bold 16px Segoe UI';
            wheelCtx.textAlign = 'center';
            wheelCtx.fillText('MEGA', centerX, centerY - 8);
            wheelCtx.fillText('WHEEL', centerX, centerY + 12);
        }

        window.manualSpin = function() {
            spinWheel();
        };

        function spinWheel() {
            if (wheelSpinning || wheelParticipants.length === 0) return;
            
            wheelSpinning = true;
            const btn = document.getElementById('spinBtn');
            if (btn) btn.disabled = true;
            
            const winnerIndex = Math.floor(Math.random() * wheelParticipants.length);
            const winner = wheelParticipants[winnerIndex];
            
            const targetRotation = (Math.PI * 2 * 5) + (winnerIndex / wheelParticipants.length) * Math.PI * 2;
            const startRotation = wheelRotation % (Math.PI * 2);
            const duration = 7000;
            const startTime = Date.now();
            
            document.getElementById('wheelOverlay').classList.add('show');
            document.getElementById('overlayWheelContent').innerHTML = `
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <canvas id="overlayCanvas" width="500" height="500"></canvas>
                </div>
            `;
            
            const overlayCanvas = document.getElementById('overlayCanvas');
            const overlayCtx = overlayCanvas.getContext('2d');
            let lastSegment = -1;
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 4);
                
                wheelRotation = startRotation + targetRotation * eased;
                
                const centerX = 250;
                const centerY = 250;
                const radius = 220;
                const segmentAngle = (Math.PI * 2) / wheelParticipants.length;
                
                overlayCtx.clearRect(0, 0, 500, 500);
                
                wheelParticipants.forEach((user, i) => {
                    const startAngle = i * segmentAngle + wheelRotation;
                    const endAngle = (i + 1) * segmentAngle + wheelRotation;
                    
                    const colors = ['#7c5cfc', '#00cec9', '#00b894', '#fdcb6e', '#e17055', '#6c5ce7', '#a29bfe'];
                    overlayCtx.fillStyle = colors[i % colors.length];
                    
                    overlayCtx.beginPath();
                    overlayCtx.moveTo(centerX, centerY);
                    overlayCtx.arc(centerX, centerY, radius, startAngle, endAngle);
                    overlayCtx.closePath();
                    overlayCtx.fill();
                    overlayCtx.strokeStyle = '#000';
                    overlayCtx.lineWidth = 2;
                    overlayCtx.stroke();
                    
                    overlayCtx.save();
                    overlayCtx.translate(centerX, centerY);
                    overlayCtx.rotate(startAngle + segmentAngle / 2);
                    overlayCtx.textAlign = 'center';
                    overlayCtx.fillStyle = '#fff';
                    overlayCtx.font = 'bold 14px Segoe UI';
                    overlayCtx.fillText(user.name.substring(0, 15), radius * 0.7, 5);
                    overlayCtx.restore();
                });
                
                const ledCount = 24;
                for (let i = 0; i < ledCount; i++) {
                    const angle = (i / ledCount) * Math.PI * 2 + wheelRotation * 0.5;
                    const x = centerX + Math.cos(angle) * (radius + 15);
                    const y = centerY + Math.sin(angle) * (radius + 15);
                    
                    overlayCtx.beginPath();
                    overlayCtx.arc(x, y, 5, 0, Math.PI * 2);
                    overlayCtx.fillStyle = (Date.now() + i * 100) % 1000 < 500 ? '#ffd700' : '#444';
                    overlayCtx.fill();
                }
                
                overlayCtx.beginPath();
                overlayCtx.arc(centerX, centerY, 60, 0, Math.PI * 2);
                overlayCtx.fillStyle = '#ffd700';
                overlayCtx.fill();
                overlayCtx.strokeStyle = '#000';
                overlayCtx.lineWidth = 3;
                overlayCtx.stroke();
                
                overlayCtx.fillStyle = '#000';
                overlayCtx.font = 'bold 16px Segoe UI';
                overlayCtx.textAlign = 'center';
                overlayCtx.fillText('MEGA', centerX, centerY - 8);
                overlayCtx.fillText('WHEEL', centerX, centerY + 12);
                
                const currentSegment = Math.floor(((wheelRotation % (Math.PI * 2)) / (Math.PI * 2)) * wheelParticipants.length);
                if (currentSegment !== lastSegment) {
                    tick();
                    lastSegment = currentSegment;
                }
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    beep();
                    flashWinner(overlayCtx, winnerIndex);
                    showConfetti();
                    
                    const users = getUsers();
                    const winnerUser = users.find(u => u.id === winner.id);
                    if (winnerUser) {
                        winnerUser.stars += 20;
                        setUsers(users);
                    }
                    
                    const history = getHistory();
                    history.push({
                        time: Date.now(),
                        winner: winner.name,
                        stars: 20
                    });
                    setHistory(history);
                    
                    setTimeout(() => {
                        document.getElementById('wheelOverlay').classList.remove('show');
                        wheelSpinning = false;
                        const btn = document.getElementById('spinBtn');
                        if (btn) btn.disabled = false;
                        alert(`🎉 ${winner.name} a gagné 20 étoiles !`);
                        if (currentPage === 'wheel') draw();
                    }, 3000);
                }
            }
            
            animate();
        }

        function flashWinner(ctx, index) {
            const segmentAngle = (Math.PI * 2) / wheelParticipants.length;
            const startAngle = index * segmentAngle + wheelRotation;
            const endAngle = (index + 1) * segmentAngle + wheelRotation;
            
            let flash = 0;
            const flashInterval = setInterval(() => {
                if (flash >= 6) {
                    clearInterval(flashInterval);
                    return;
                }
                
                ctx.fillStyle = flash % 2 === 0 ? '#ffd700' : '#fff';
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 220, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();
                
                flash++;
            }, 200);
        }

        function showConfetti() {
            const colors = ['#7c5cfc', '#00cec9', '#00b894', '#fdcb6e', '#e17055', '#ffd700'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(confetti);
                    
                    const duration = 2000 + Math.random() * 1000;
                    const endY = window.innerHeight + 20;
                    const startTime = Date.now();
                    
                    function fall() {
                        const elapsed = Date.now() - startTime;
                        const progress = elapsed / duration;
                        
                        if (progress < 1) {
                            confetti.style.top = (progress * endY) + 'px';
                            confetti.style.transform = `rotate(${progress * 720}deg)`;
                            requestAnimationFrame(fall);
                        } else {
                            confetti.remove();
                        }
                    }
                    fall();
                }, i * 50);
            }
        }

        function getNextHour() {
            const now = new Date();
            const next = new Date(now);
            next.setHours(now.getHours() + 1);
            next.setMinutes(0);
            next.setSeconds(0);
            next.setMilliseconds(0);
            return next.getTime();
        }

                if (currentPage === 'wheel' && !wheelSpinning) {
                    spinWheel();
                }
            }
        }
