                            <button class="btn btn-danger" onclick="rejectUser(${user.id})">❌ Refuser</button>
                            <button class="btn btn-warning" onclick="banUser(${user.id})">🚫 Bannir</button>
                        </div>
                    </div>
                `;
            });
            
            if (pendingUsers.length === 0) {
                html += '<p class="text-muted">Aucune inscription en attente</p>';
            }
            
            html += '<h3 class="mb-16" style="margin-top: 32px;">Membres traités</h3>';
            html += '<div class="table-container"><table><thead><tr><th>Nom</th><th>Statut</th><th>Actions</th></tr></thead><tbody>';
            
            processed.forEach(user => {
                html += `
                    <tr>
                        <td>${esc(user.name)}</td>
                        <td><span class="tag ${user.status}">${user.status === 'approved' ? '✅ Approuvé' : '❌ Refusé'}</span></td>
                        <td>
                            ${user.ban ? 
                                `<button class="btn btn-success btn-sm" onclick="unbanUser(${user.id})">Débannir</button>` :
                                `<button class="btn btn-danger btn-sm" onclick="banUser(${user.id})">Bannir</button>`}
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table></div>';
            
            return html;
        }

        function drawAdminProducts() {
            const products = getProducts();
            const users = getUsers();
            const pendingProds = products.filter(p => p.status === 'pending');
            const approved = products.filter(p => p.status === 'approved' || p.status === 'sold');
            
            let html = '<h3 class="mb-16">Produits en attente</h3>';
            html += '<div class="table-container"><table><thead><tr><th>Nom</th><th>Vendeur</th><th>Prix</th><th>Actions</th></tr></thead><tbody>';
            
            pendingProds.forEach(product => {
                const seller = users.find(u => u.id === product.userId);
                html += `
                    <tr>
                        <td>${esc(product.name)}</td>
                        <td>${esc
(seller?.name || 'Inconnu')}</td>
                        <td>${product.price.toLocaleString()} Ar</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="approveProduct(${product.id})">✅ Approuver</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectProduct(${product.id})">❌ Refuser</button>
                        </td>
                    </tr>
                `;
            });
            
            if (pendingProds.length === 0) {
                html += '<tr><td colspan="4" style="text-align:center; color: #888;">Aucun produit en attente</td></tr>';
            }
            
            html += '</tbody></table></div>';
            
            html += '<h3 class="mb-16" style="margin-top: 32px;">Produits approuvés</h3>';
            html += '<div class="table-container"><table><thead><tr><th>Nom</th><th>Vendeur</th><th>Prix</th><th>Statut</th></tr></thead><tbody>';
            
            approved.forEach(product => {
                const seller = users.find(u => u.id === product.userId);
                html += `
                    <tr>
                        <td>${esc(product.name)}</td>
                        <td>${esc(seller?.name || 'Inconnu')}</td>
                        <td>${product.price.toLocaleString()} Ar</td>
                        <td><span class="tag ${product.status}">${product.status === 'sold' ? '✅ Vendu' : '🟢 Disponible'}</span></td>
                    </tr>
                `;
            });
            
            html += '</tbody></table></div>';
            
            return html;
        }

        function drawAdminMembers() {
            const users = getUsers().filter(u => u.role !== 'admin');
            
            let html = `
                <h3 class="mb-16">Tous les membres</h3>
                <input type="text" class="search-box" id="memberSearch" placeholder="🔍 Rechercher un membre...">
                <div class="table-container">
                    <table id="membersTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nom</th>
                                <th>Téléphone</th>
                                <th>Mot de passe</th>
                                <th>Lieu</th>
                                <th>Étoiles</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            users.forEach((user, index) => {
                html += `
                    <tr class="member-row" data-search="${user.name.toLowerCase()} ${user.phone}">
                        <td>${index + 1}</td>
                        <td>${esc(user.name)}</td>
                        <td>${esc(user.phone)}</td>
                        <td style="font-family: 'Courier New', monospace; color: var(--gold);">${esc(user.password)}</td>
                        <td>${esc(user.city)}, ${esc(user.quartier)}</td>
                        <td style="color: var(--gold); font-weight: bold;">${user.stars} ⭐</td>
                        <td><span class="tag ${user.status}">${user.ban ? '🚫 Banni' : (user.status === 'approved' ? '✅ Actif' : '⏳ Pending')}</span></td>
                        <td>
                            ${user.ban ? 
                                `<button class="btn btn-success btn-sm" onclick="unbanUser(${user.id})">Débannir</button>` :
                                `<button class="btn btn-danger btn-sm" onclick="banUser(${user.id})">Bannir</button>`}
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table></div>';
            
            setTimeout(() => {
                const searchBox = document.getElementById('memberSearch');
                if (searchBox) {
                    searchBox.addEventListener('input', function() {
                        const query = this.value.toLowerCase();
                        const rows = document.querySelectorAll('.member-row');
                        rows.forEach(row => {
                            const search = row.getAttribute('data-search');
                            row.style.display = search.includes(query) ? '' : 'none';
                        });
                    });
                }
            }, 100);
            
            return html;
        }

        function drawAdminOrders() {
            const orders = getOrders();
            const users = getUsers();
            const pendingOrds = orders.filter(o => o.status === 'pending');
            const approved = orders.filter(o => o.status === 'approved');
            
            let html = '<h3 class="mb-16">Commandes en attente</h3>';
            html += '<div class="table-container"><table><thead><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th><th>Actions</th></tr></thead><tbody>';
            
            pendingOrds.forEach(order => {
                const buyer = users.find(u => u.id === order.buyerId);
                const seller = users.find(u => u.id === order.sellerId);
                
                if (order.productName === '__WITHDRAWAL__') {
                    html += `
                        <tr>
                            <td style="color: var(--gold); font-weight: bold;">💰 RETRAIT D'ÉTOILES</td>
                            <td>${esc(buyer?.name || 'Inconnu')} (${esc(buyer?.phone || 'N/A')})</td>
                            <td>-</td>
                            <td style="color: var(--gold);">${order.price} ⭐</td>
                            <td>
                                <button class="btn btn-success btn-sm" onclick="approveWithdrawal(${order.id})">✅ Approuver</button>
                            </td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>${esc(order.productName)}</td>
                            <td>${esc(buyer?.name || 'Inconnu')} (${esc(buyer?.phone || 'N/A')})</td>
                            <td>${esc(seller?.name || 'Inconnu')} (${esc(seller?.phone || 'N/A')})</td>
                            <td>${order.price.toLocaleString()} Ar</td>
                            <td>
                                <button class="btn btn-success btn-sm" onclick="approveOrder(${order.id})">✅ Approuver</button>
                            </td>
                        </tr>
                    `;
                }
            });
            
            if (pendingOrds.length === 0) {
                html += '<tr><td colspan="5" style="text-align:center; color: #888;">Aucune commande en attente</td></tr>';
            }
            
            html += '</tbody></table></div>';
            
            html += '<h3 class="mb-16" style="margin-top: 32px;">Commandes approuvées</h3>';
            html += '<div class="table-container"><table><thead><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th><th>Date</th></tr></thead><tbody>';
            
            approved.forEach(order => {
                const buyer = users.find(u => u.id === order.buyerId);
                const seller = users.find(u => u.id === order.sellerId);
                
                if (order.productName === '__WITHDRAWAL__') {
                    html += `
                        <tr>
                            <td style="color: var(--gold);">💰 RETRAIT</td>
                            <td>${esc(buyer?.name || 'Inconnu')}</td>
                            <td>-</td>
                            <td style="color: var(--gold);">${order.price} ⭐</td>
                            <td>${formatDate(order.createdAt)}</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>${esc(order.productName)}</td>
                            <td>${esc(buyer?.name || 'Inconnu')}</td>
                            <td>${esc(seller?.name || 'Inconnu')}</td>
                            <td>${order.price.toLocaleString()} Ar</td>
                            <td>${formatDate(order.createdAt)}</td>
                        </tr>
                    `;
                }
            });
            
            html += '</tbody></table></div>';
            
            return html;
        }

        function drawAdminForum() {
            const comments = getComments();
            const users = getUsers();
            const posts = getPosts();
            const pendingComments = comments.filter(c => c.status === 'pending');
            
            let html = `
                <div class="alert warning">
                    ⚠️ <strong>Attention:</strong> Vérifier les insultes, spam ou contenu inapproprié avant d'approuver
                </div>
                <h3 class="mb-16">Commentaires en attente de modération</h3>
            `;
            
            pendingComments.forEach(comment => {
                const author = users.find(u => u.id === comment.userId);
                const post = posts.find(p => p.id === comment.postId);
                
                html += `
                    <div class="reg-card">
                        <div class="user-name">${esc(author?.name || 'Inconnu')}</div>
                        <div style="margin-bottom: 12px; color: #888; font-size: 14px;">
                            Post: <strong style="color: var(--secondary);">${esc(post?.title || 'Inconnu')}</strong>
                        </div>
                        <div style="padding: 16px; background: rgba(124, 92, 252, 0.1); border-radius: 8px; margin-bottom: 16px;">
                            <p style="color: #e0e0e0; line-height: 1.6;">${esc(comment.content)}</p>
                        </div>
                        <div class="actions">
                            <button class="btn btn-success" onclick="approveComment(${comment.id})">✅ Approuver</button>
                            <button class="btn btn-danger" onclick="deleteComment(${comment.id})">🗑️ Supprimer</button>
                            <button class="btn btn-warning" onclick="banUser(${comment.userId})">🚫 Bannir l'auteur</button>
                        </div>
                    </div>
                `;
            });
            
            if (pendingComments.length === 0) {
                html += '<p class="text-muted">✅ Aucun commentaire en attente</p>';
            }
            
            return html;
        }

        function drawAdminStars() {
            const users = getUsers().filter(u => u.role !== 'admin').sort((a, b) => b.stars - a.stars);
            
            let html = '<h3 class="mb-24">🏆 Classement des étoiles</h3>';
            
            users.forEach((user, index) => {
                const medals = ['🥇', '🥈', '🥉'];
                const medal = index < 3 ? medals[index] : '';
                
                html += `
                    <div class="leaderboard-item">
                        <div class="rank">${medal || (index + 1)}</div>
                        <div class="info">
                            <div class="name">${esc(user.name)}</div>
                            <div class="stars">${user.stars} ⭐</div>
                        </div>
                        <div>
                            <span class="tag ${user.ban ? 'pending' : 'approved'}">
                                ${user.ban ? '🚫 Banni' : '✅ Actif'}
                            </span>
                        </div>
                    </div>
                `;
            });
            
            return html;
        }

        // ADMIN ACTIONS
        window.approveUser = function(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.status = 'approved';
                setUsers(users);
                draw();
            }
        };

        window.rejectUser = function(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.status = 'rejected';
                setUsers(users);
                draw();
            }
        };

        window.banUser = function(userId) {
            if (confirm('Voulez-vous vraiment bannir cet utilisateur ?')) {
                const users = getUsers();
                const user = users.find(u => u.id === userId);
                if (user) {
                    user.ban = true;
                    setUsers(users);
                    draw();
                }
            }
        };

        window.unbanUser = function(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.ban = false;
                setUsers(users);
                draw();
            }
        };

        window.approveProduct = function(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (product) {
                product.status = 'approved';
                setProducts(products);
                draw();
            }
        };

        window.rejectProduct = function(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (product) {
                product.status = 'rejected';
                setProducts(products);
                draw();
            }
        };

        window.approveOrder = function(orderId) {
            const orders = getOrders();
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            
            order.status = 'approved';
            setOrders(orders);
            
            const products = getProducts();
            const product = products.find(p => p.id === order.productId);
            if (product) {
                product.status = 'sold';
                setProducts(products);
            }
            
            const users = getUsers();
            const seller = users.find(u => u.id === order.sellerId);
            const buyer = users.find(u => u.id === order.buyerId);
            
            if (seller) seller.stars += 10;
            if (buyer) buyer.stars += 5;
            
            setUsers(users);
            draw();
        };

        window.approveWithdrawal = function(orderId) {
            if (confirm('Confirmer le retrait de 1000 étoiles ?')) {
                const orders = getOrders();
                const order = orders.find(o => o.id === orderId);
                if (!order) return;
                
                order.status = 'approved';
                setOrders(orders);
                
                const users = getUsers();
                const user = users.find(u => u.id === order.buyerId);
                if (user) {
                    user.stars -= 1000;
                    setUsers(users);
                }
                
                draw();
                alert('✅ Retrait approuvé');
            }
        };

        window.approveComment = function(commentId) {
            const comments = getComments();
            const comment = comments.find(c => c.id === commentId);
            if (!comment) return;
            
            comment.status = 'approved';
            setComments(comments);
            
            const users = getUsers();
            const author = users.find(u => u.id === comment.userId);
            if (author) {
                author.stars += 1;
                setUsers(users);
            }
            
            draw();
        };

        window.deleteComment = function(commentId) {
            if (confirm('Supprimer ce commentaire ?')) {
                let comments = getComments();
                comments = comments.filter(c => c.id !== commentId);
                setComments(comments);
                draw();
            }
        };

        // MODAL
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // START
        init();
    </script>
</body>
</html>
