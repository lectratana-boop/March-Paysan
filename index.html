<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket - Marketplace Madagascar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
font-family:Segoe UI;
background:#0a0a1a;
color:#fff;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#12122a;
padding:25px;
border-radius:12px;
width:300px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
background:#1a1a3e;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
background:#7c5cfc;
color:white;
cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="auth" class="card">
<h2>MadaMarket</h2>

<input id="phone" placeholder="Téléphone">
<input id="pass" type="password" placeholder="Mot de passe">

<button onclick="login()">Connexion</button>

<hr>

<h3>Inscription</h3>

<input id="rname" placeholder="Nom">
<input id="rphone" placeholder="Téléphone">
<input id="rpass" type="password" placeholder="Mot de passe">

<button onclick="register()">Créer compte</button>

</div>

<div id="app" class="hidden card">
<h2 id="welcome"></h2>
<p>Bienvenue dans MadaMarket 🚀</p>
<button onclick="logout()">Déconnexion</button>
</div>

<script>

/* ===== DATABASE ===== */
function getUsers(){
return JSON.parse(localStorage.getItem("users")||"[]");
}

function saveUsers(u){
localStorage.setItem("users",JSON.stringify(u));
}

/* ===== ADMIN AUTO ===== */
(function(){
let u=getUsers();
if(!u.find(x=>x.phone==="0340000000")){
u.push({
name:"Admin",
phone:"0340000000",
password:"admin123",
role:"admin",
status:"approved"
});
saveUsers(u);
}
})();

/* ===== REGISTER ===== */
function register(){
let name=document.getElementById("rname").value;
let phone=document.getElementById("rphone").value;
let pass=document.getElementById("rpass").value;

if(!name||!phone||!pass){
alert("Remplis tout");
return;
}

let u=getUsers();
u.push({
name,
phone,
password:pass,
role:"user",
status:"pending"
});

saveUsers(u);

alert("Inscription envoyée (attente admin)");
}

/* ===== LOGIN ===== */
function login(){
let phone=document.getElementById("phone").value;
let pass=document.getElementById("pass").value;

let u=getUsers().find(x=>x.phone===phone && x.password===pass);

if(!u){
alert("Erreur");
return;
}

if(u.status!=="approved"){
alert("En attente validation admin");
return;
}

localStorage.setItem("session",phone);

startApp(u);
}

/* ===== APP ===== */
function startApp(u){
document.getElementById("auth").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
document.getElementById("welcome").innerText="Salut "+u.name;
}

/* ===== LOGOUT ===== */
function logout(){
localStorage.removeItem("session");
location.reload();
}

/* ===== RESTORE ===== */
(function(){
let s=localStorage.getItem("session");
if(!s) return;
let u=getUsers().find(x=>x.phone===s);
if(u && u.status==="approved"){
startApp(u);
}
})();

</script>

</body>
</html>
