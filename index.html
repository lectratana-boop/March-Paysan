<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--bg4:#252550;--pri:#7c5cfc;--pri2:#9b7dff;--sec:#00cec9;--ok:#00b894;--warn:#fdcb6e;--err:#e17055;--txt:#e8e8ff;--txt2:#a0a0c0;--gold:#ffd700;--r:12px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{cursor:pointer;border:none;border-radius:var(--r);padding:10px 20px;font-size:14px;font-weight:600;transition:.2s}
button:hover{opacity:.9}
button:disabled{opacity:.3;cursor:not-allowed}
input,textarea,select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:12px;color:var(--txt);font-size:14px;width:100%;margin-bottom:10px}
input:focus,textarea:focus{outline:none;border-color:var(--pri)}
.bp{background:var(--pri);color:#fff}
.bs{background:var(--ok);color:#fff}
.bd{background:var(--err);color:#fff}
.bw{background:var(--warn);color:#222}
.sm{padding:6px 14px;font-size:12px}
.bk{width:100%}
.hidden{display:none!important}
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.tp{background:rgba(253,203,110,.2);color:var(--warn)}
.ta{background:rgba(0,184,148,.2);color:var(--ok)}
.tr2{background:rgba(225,112,85,.2);color:var(--err)}
.fx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tc{text-align:center}
.mb{margin-bottom:12px}
.mt{margin-top:16px}
.sd{color:var(--gold)}
label.fl{font-size:11px;color:var(--txt2);display:block;margin-bottom:2px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a,#1a1040,#0a0a1a);padding:16px}
.abox{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:28px;width:100%;max-width:380px}
.abox h1{text-align:center;margin-bottom:4px;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}
.abox .sub{text-align:center;color:var(--txt2);margin-bottom:14px;font-size:12px}
.atb{display:flex;margin-bottom:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bg4)}
.atb div{flex:1;padding:10px;text-align:center;background:var(--bg);color:var(--txt2);cursor:pointer;font-weight:600;font-size:13px}
.atb div.on{background:var(--pri);color:#fff}
.msg{padding:10px;border-radius:var(--r);margin-bottom:10px;font-size:12px;text-align:center;line-height:1.5}
.msg.ok{background:rgba(0,184,148,.15);color:var(--ok)}
.msg.err{background:rgba(225,112,85,.15);color:var(--err)}
.msg.warn{background:rgba(253,203,110,.15);color:var(--warn)}

/* TOP BAR - ALWAYS VISIBLE WHEN PENDING */
#topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(90deg,#d63031,#e17055,#fdcb6e,#e17055,#d63031);background-size:300% 100%;animation:tbs 3s linear infinite;padding:8px 16px;text-align:center;font-weight:700;font-size:13px;color:#fff;cursor:pointer;box-shadow:0 2px 20px rgba(214,48,49,.4)}
@keyframes tbs{0%{background-position:0%}100%{background-position:300%}}
#topbar:hover{filter:brightness(1.2)}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--bg4);padding:0 12px;position:sticky;top:0;z-index:100}
header.has-bar{top:36px}
.hdr{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:50px;gap:4px}
.logo{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--txt2);padding:5px 8px;font-size:10px;border-radius:6px;white-space:nowrap;position:relative}
.nav button:hover{background:var(--bg3);color:var(--txt)}
.nav button.on{background:var(--pri);color:#fff}
.nav .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:var(--err);border-radius:50%;border:2px solid var(--bg2);animation:pls .6s infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.hr{display:flex;align-items:center;gap:6px}
.av{width:26px;height:26px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff}

/* CONTENT */
main{max-width:1200px;margin:0 auto;padding:16px}
.pgt{font-size:17px;font-weight:700;margin-bottom:2px}
.pgs{color:var(--txt2);font-size:11px;margin-bottom:14px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.st{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:10px;text-align:center}
.st .v{font-size:20px;font-weight:800}.st .l{color:var(--txt2);font-size:9px;margin-top:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bg4);font-size:10px}
th{color:var(--txt2);font-weight:600;background:var(--bg3);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pc{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);overflow:hidden}
.pim{height:80px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--txt2)}
.pin{padding:8px}.pin h3{font-size:11px}.pin .pr{color:var(--sec);font-size:14px;font-weight:800;margin:2px 0}
.po{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:12px;margin-bottom:10px}
.cm{background:var(--bg3);border-radius:6px;padding:6px;margin:3px 0 3px 12px;border-left:2px solid var(--pri);font-size:10px}
.prof{background:var(--bg2);border:1px solid var(--bg4);border-radius:16px;padding:24px;text-align:center;max-width:400px;margin:0 auto}
.pbar{background:var(--bg);border-radius:20px;height:14px;overflow:hidden;margin:6px 0}
.pfill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pri),var(--gold));display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;min-width:20px}

/* TABS */
.tabs{display:flex;gap:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--bg4);padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 10px;border-radius:6px 6px 0 0;background:transparent;color:var(--txt2);font-size:10px;font-weight:600;white-space:nowrap;position:relative}
.tab:hover{background:var(--bg3);color:var(--txt)}
.tab.on{background:var(--bg3);color:var(--pri2);border-bottom:2px solid var(--pri)}
.tab .dot{position:absolute;top:0;right:0;width:8px;height:8px;background:var(--err);border-radius:50%;animation:pls .6s infinite}

/* MEGA WHEEL */
#mwOv{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,15,.97);z-index:9999;display:flex;align-items:center;justify-content:center}
.mwp{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:28px solid var(--gold);filter:drop-shadow(0 2px 6px rgba(255,215,0,.5))}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;z-index:10000;animation:confetti 3s ease-in-out forwards}
.wglow{animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 20px var(--gold)}}

@media(max-width:600px){.pgrid{grid-template-columns:1fr}.abox{padding:18px}.prof{padding:16px}main{padding:10px}canvas.mwc{width:240px!important;height:240px!important}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
</style>
</head>
<body>

<div id="auth">
<div class="abox">
<h1><i class="fas fa-store"></i> MadaMarket</h1>
<p class="sub">Marketplace Madagascar</p>
<div id="amsg"></div>
<div class="atb">
<div class="on" onclick="aTab('login')">Connexion</div>
<div onclick="aTab('reg')">Inscription</div>
</div>
<div id="fLogin">
<label class="fl">📱 Téléphone</label>
<input type="tel" id="lph" placeholder="034 XX XXX XX">
<label class="fl">🔒 Mot de passe</label>
<input type="password" id="lpw" placeholder="Mot de passe">
<button class="bp bk" onclick="login()"><i class="fas fa-sign-in-alt"></i> Connexion</button>
</div>
<div id="fReg" class="hidden">
<label class="fl">👤 Nom *</label><input id="rn" placeholder="Nom complet">
<label class="fl">📱 Téléphone *</label><input type="tel" id="rp" placeholder="034 XX XXX XX">
<label class="fl">🔒 Mot de passe *</label><input type="password" id="rpw" placeholder="Min 4 caractères">
<label class="fl">🏙️ Ville *</label><input id="rc" placeholder="Ville">
<label class="fl">🏠 Quartier *</label><input id="rq" placeholder="Quartier">
<button class="bp bk" onclick="register()"><i class="fas fa-user-plus"></i> S'inscrire</button>
</div>
<div style="margin-top:10px;text-align:center"><button class="sm bd" onclick="if(confirm('Reset?')){localStorage.clear();location.reload()}" style="opacity:.3;font-size:9px"><i class="fas fa-trash"></i> Reset</button></div>
</div>
</div>

<div id="topbar" class="hidden" onclick="PAGE='admin';ATAB='notifs';draw()"></div>

<div id="app" class="hidden">
<header id="hdr">
<div class="hdr">
<div class="logo"><i class="fas fa-store"></i> MadaMarket</div>
<div class="nav" id="navEl"></div>
<div class="hr">
<span style="font-size:10px"><i class="fas fa-star sd"></i> <span id="hStars">0</span></span>
<div class="av" id="hAv">A</div>
<span id="hNm" style="font-size:10px"></span>
<button class="sm bd" onclick="logout()" style="padding:4px 8px"><i class="fas fa-sign-out-alt"></i></button>
</div>
</div>
</header>
<main id="mainEl"></main>
</div>

<div id="mwOv" class="hidden">
<div style="text-align:center;padding:10px">
<div style="font-size:20px;font-weight:800;color:var(--gold)"><i class="fas fa-trophy"></i> MEGA WHEEL</div>
<div style="color:var(--txt2);font-size:11px;margin-bottom:10px">20⭐ à gagner!</div>
<div style="position:relative;display:inline-block"><div class="mwp"></div><canvas id="mwCvs" class="mwc" width="300" height="300" style="border-radius:50%"></canvas></div>
<div id="mwR" style="margin-top:10px;min-height:24px;font-size:14px"></div>
</div>
</div>

<script>
// =========================================
// SIMPLE DATABASE
// =========================================
const db = {
  users: () => JSON.parse(localStorage.getItem('u') || '[]'),
  products: () => JSON.parse(localStorage.getItem('p') || '[]'),
  posts: () => JSON.parse(localStorage.getItem('po') || '[]'),
  comments: () => JSON.parse(localStorage.getItem('c') || '[]'),
  orders: () => JSON.parse(localStorage.getItem('o') || '[]'),
  hist: () => JSON.parse(localStorage.getItem('h') || '[]'),
  save: {
    users: v => localStorage.setItem('u', JSON.stringify(v)),
    products: v => localStorage.setItem('p', JSON.stringify(v)),
    posts: v => localStorage.setItem('po', JSON.stringify(v)),
    comments: v => localStorage.setItem('c', JSON.stringify(v)),
    orders: v => localStorage.setItem('o', JSON.stringify(v)),
    hist: v => localStorage.setItem('h', JSON.stringify(v))
  }
};

// Ensure admin exists
(function initAdmin(){
  let u = db.users();
  if (!u.find(x => x.role === 'admin')) {
    u.push({id:'a1',name:'Admin',phone:'0340000000',password:'admin123',city:'Tana',quartier:'Centre',role:'admin',status:'approved',stars:0,ban:false,regAt:new Date().toISOString()});
    db.save.users(u);
  }
})();

// =========================================
// HELPERS
// =========================================
const ID = () => Math.random().toString(36).substr(2,9);
const ESC = s => {if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const PH = p => (p||'').replace(/[\s\-\.]/g,'');
const FD = d => d ? new Date(d).toLocaleDateString('fr',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '-';
const IC = c => ({Électronique:'laptop',Vêtements:'tshirt',Maison:'home',Alimentation:'utensils',Services:'handshake'}[c]||'box');

// =========================================
// PENDING COUNTS - always fresh
// =========================================
function pending() {
  const u=db.users(), p=db.products(), c=db.comments(), o=db.orders();
  return {
    reg: u.filter(x=>x.status==='pending'&&x.role!=='admin'&&!x.ban).length,
    prod: p.filter(x=>x.status==='pending').length,
    cmt: c.filter(x=>x.status==='pending').length,
    ord: o.filter(x=>x.status==='pending').length,
    ban: u.filter(x=>x.ban).length,
    get total(){ return this.reg+this.prod+this.cmt+this.ord }
  };
}

// =========================================
// STATE
// =========================================
let ME = null;
let PAGE = 'accueil';
let ATAB = 'notifs';

// =========================================
// AUTH
// =========================================
function aTab(t) {
  document.querySelectorAll('.atb div').forEach((d,i) => {
    d.classList.toggle('on', t==='login'?i===0:i===1);
  });
  document.getElementById('fLogin').classList.toggle('hidden', t!=='login');
  document.getElementById('fReg').classList.toggle('hidden', t!=='reg');
  document.getElementById('amsg').innerHTML = '';
}

function showMsg(m,t) { document.getElementById('amsg').innerHTML = `<div class="msg ${t}">${m}</div>`; }

function register() {
  const nm=document.getElementById('rn').value.trim();
  const ph=PH(document.getElementById('rp').value);
  const pw=document.getElementById('rpw').value;
  const ci=document.getElementById('rc').value.trim();
  const qt=document.getElementById('rq').value.trim();
  if(!nm||!ph||!pw||!ci||!qt) return showMsg('Tous les champs sont obligatoires','err');
  if(ph.length<8) return showMsg('Numéro invalide','err');
  if(pw.length<4) return showMsg('MDP min 4 caractères','err');
  let users = db.users();
  if(users.find(x=>PH(x.phone)===ph)) return showMsg('Numéro déjà inscrit','err');
  users.push({id:ID(),name:nm,phone:ph,password:pw,city:ci,quartier:qt,role:'user',status:'pending',stars:0,ban:false,regAt:new Date().toISOString()});
  db.save.users(users);
  showMsg('✅ Inscription envoyée! Après validation admin, connectez-vous avec tél + mdp','ok');
  ['rn','rp','rpw','rc','rq'].forEach(x=>document.getElementById(x).value='');
}

function login() {
  const ph=PH(document.getElementById('lph').value);
  const pw=document.getElementById('lpw').value;
  if(!ph||!pw) return showMsg('Remplissez tout','err');
  const u = db.users().find(x=>PH(x.phone)===ph&&x.password===pw);
  if(!u) return showMsg('❌ Incorrect','err');
  if(u.ban) return showMsg('🚫 Compte banni','err');
  if(u.status==='pending') return showMsg('⏳ En attente de validation admin','warn');
  if(u.status==='rejected') return showMsg('❌ Refusé','err');
  ME = u;
  localStorage.setItem('session', u.id);
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  draw();
}

function logout() {
  ME = null;
  localStorage.removeItem('session');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  document.getElementById('amsg').innerHTML = '';
  document.getElementById('lph').value='';
  document.getElementById('lpw').value='';
}

function restoreSession() {
  const sid = localStorage.getItem('session');
  if(!sid) return;
  const u = db.users().find(x=>x.id===sid&&x.status==='approved'&&!x.ban);
  if(u) { ME=u; document.getElementById('auth').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); draw(); }
}

// =========================================
// MASTER DRAW - renders everything
// =========================================
function draw() {
  if(!ME) return;
  // Refresh user data
  const fresh = db.users().find(x=>x.id===ME.id);
  if(fresh) { ME.stars=fresh.stars; ME.ban=fresh.ban; }
  if(ME.ban) { logout(); alert('Votre compte a été banni'); return; }

  document.getElementById('hAv').textContent = ME.name.charAt(0);
  document.getElementById('hNm').textContent = ME.name;
  document.getElementById('hStars').textContent = ME.stars||0;

  const isAdmin = ME.role==='admin';
  const p = pending();

  // TOP BAR - always visible for admin when pending
  const tb = document.getElementById('topbar');
  if(isAdmin && p.total > 0) {
    let msg = [];
    if(p.reg) msg.push('👤'+p.reg+' inscription(s)');
    if(p.prod) msg.push('📦'+p.prod+' produit(s)');
    if(p.cmt) msg.push('💬'+p.cmt+' commentaire(s)');
    if(p.ord) msg.push('🛒'+p.ord+' commande(s)');
    tb.textContent = '🔔 ' + msg.join(' | ') + ' — CLIQUEZ ICI';
    tb.classList.remove('hidden');
    document.getElementById('hdr').classList.add('has-bar');
  } else {
    tb.classList.add('hidden');
    document.getElementById('hdr').classList.remove('has-bar');
  }

  // NAV
  let nav = '';
  const pages = [{id:'accueil',ic:'home',lb:'Accueil'},{id:'produits',ic:'box',lb:'Produits'},{id:'forum',ic:'comments',lb:'Forum'},{id:'profil',ic:'user',lb:'Profil'},{id:'wheel',ic:'dharmachakra',lb:'Wheel'}];
  if(isAdmin) pages.push({id:'admin',ic:'shield-alt',lb:'Admin'});
  pages.forEach(pg => {
    const active = PAGE===pg.id;
    const hasDot = isAdmin && pg.id==='admin' && p.total>0;
    nav += `<button class="${active?'on':''}" onclick="PAGE='${pg.id}';draw()"><i class="fas fa-${pg.ic}"></i> ${pg.lb}${hasDot?'<span class="dot"></span>':''}</button>`;
  });
  document.getElementById('navEl').innerHTML = nav;

  // CONTENT
  const el = document.getElementById('mainEl');
  switch(PAGE) {
    case 'accueil': drawAccueil(el); break;
    case 'produits': drawProduits(el); break;
    case 'forum': drawForum(el); break;
    case 'profil': drawProfil(el); break;
    case 'wheel': drawWheel(el); break;
    case 'admin': drawAdmin(el); break;
    default: drawAccueil(el);
  }
}

// =========================================
// POLLING - 300ms - just calls draw() for admin
// =========================================
let lastTotal = -1;
setInterval(() => {
  if(!ME || ME.role !== 'admin') return;
  const p = pending();
  if(p.total !== lastTotal) {
    lastTotal = p.total;
    draw();
    if(p.total > 0) beep();
  }
}, 300);

// Also listen storage events for cross-tab
window.addEventListener('storage', () => {
  if(ME && ME.role === 'admin') { draw(); beep(); }
});

function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.2;o.frequency.value=800;o.start();g.gain.linearRampToValueAtTime(0,c.currentTime+.3);o.stop(c.currentTime+.3)}catch(e){}}
function tick(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.05;o.frequency.value=400+Math.random()*400;o.start();g.gain.linearRampToValueAtTime(0,c.currentTime+.02);o.stop(c.currentTime+.02)}catch(e){}}

// =========================================
// ACCUEIL
// =========================================
function drawAccueil(el) {
  const users=db.users(),prods=db.products(),orders=db.orders();
  const p=pending();
  let h = `<h1 class="pgt">Bienvenue ${ESC(ME.name)}</h1><p class="pgs">Tableau de bord</p><div class="sts">`;
  if(ME.role==='admin') {
    h+=`<div class="st"><div class="v" style="color:var(--err)">${p.reg}</div><div class="l">Inscriptions</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--pri2)">${p.prod}</div><div class="l">Produits</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--sec)">${users.filter(u=>u.role!=='admin').length}</div><div class="l">Membres</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--ok)">${p.ord}</div><div class="l">Commandes</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--gold)">${p.cmt}</div><div class="l">Commentaires</div></div>`;
  } else {
    h+=`<div class="st"><div class="v" style="color:var(--pri2)">${prods.filter(x=>x.userId===ME.id).length}</div><div class="l">Produits</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--gold)">${ME.stars||0}</div><div class="l">⭐</div></div>`;
    h+=`<div class="st"><div class="v" style="color:var(--ok)">${prods.filter(x=>x.status==='approved').length}</div><div class="l">Dispo</div></div>`;
  }
  h += '</div>';
  const rec = prods.filter(x=>x.status==='approved').slice(-4).reverse();
  if(rec.length) {
    h += '<h3 class="mb" style="font-size:14px">Récents</h3><div class="pgrid">';
    rec.forEach(pr => {

const WCOL=['#7c5cfc','#00cec9','#e17055','#00b894','#fdcb6e','#fd79a8','#6c5ce7','#74b9ff','#a29bfe','#ff7675','#55efc4','#fab1a0'];
function drawMW(cvs,m,ang,hi){
  const ctx=cvs.getContext('2d'),W=cvs.width,H=cvs.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-16;
  ctx.clearRect(0,0,W,H);
  const n=m.length,seg=Math.PI*2/n;
  for(let i=0;i<28;i++){const la=i*Math.PI*2/28+ang*.15;ctx.beginPath();ctx.arc(cx+(R+10)*Math.cos(la),cy+(R+10)*Math.sin(la),2.5,0,Math.PI*2);ctx.fillStyle=['#ffd700','#ff6b6b','#7c5cfc'][i%3];ctx.fill()}
  for(let i=0;i<n;i++){const a1=i*seg+ang-Math.PI/2,a2=a1+seg;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a1,a2);ctx.closePath();ctx.fillStyle=WCOL[i%WCOL.length];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5;ctx.stroke();
  if(hi===i){ctx.fillStyle='rgba(255,215,0,.35)';ctx.fill();ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.stroke()}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(a1+seg/2);ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(11,200/n)}px sans-serif`;ctx.textAlign='right';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=2;ctx.fillText(m[i].name.substring(0,7),R-10,0);ctx.shadowBlur=0;ctx.restore()}
  ctx.beginPath();ctx.arc(cx,cy,R*.13,0,Math.PI*2);const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.13);ig.addColorStop(0,'#ffd700');ig.addColorStop(1,'#b8860b');ctx.fillStyle=ig;ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MEGA',cx,cy-3);ctx.font='bold 6px sans-serif';ctx.fillText('WHEEL',cx,cy+4);
}

function drawWheel(el) {

// Countdown
setInterval(()=>{const n=new Date();const m=new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000);const el=document.getElementById('rlcd');if(el)el.textContent=`${String(59-m.getMinutes()).padStart(2,'0')}:${String(59-m.getSeconds()).padStart(2,'0')}`},1000);

let spinning=false;
function spinWheel(){
  const users=db.users().filter(u=>u.role!=='admin'&&u.status==='approved'&&!u.ban);
  if(users.length<2) return alert('Min 2 membres!');
  if(spinning) return; spinning=true;
  document.querySelectorAll('button').forEach(b=>b.disabled=true);

  const wi=Math.floor(Math.random()*users.length);
  const n=users.length,sa=Math.PI*2/n;
  const target=-wi*sa-sa/2+Math.PI*2*(8+Math.floor(Math.random()*3));

  const ov=document.getElementById('mwOv'),cvs=document.getElementById('mwCvs'),res=document.getElementById('mwR');
  ov.classList.remove('hidden');
  res.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  const t0=Date.now(),dur=7000;let ls=-1;

  (function spin(){
    const t=Math.min(1,(Date.now()-t0)/dur);
    const e=1-Math.pow(1-t,4);
    const ang=e*target;
    drawMW(cvs,users,ang,t>=1?wi:-1);
    const cs=Math.floor((((-ang%(Math.PI*2))+(Math.PI*2))%(Math.PI*2))/sa);
    if(cs!==ls){tick();ls=cs}
    if(t<1) requestAnimationFrame(spin);
    else {
      beep();
      res.innerHTML=`<div style="color:var(--gold);animation:pls 1s infinite">🎉 ${ESC(users[wi].name)} gagne 20⭐! 🎉</div>`;
      let all=db.users();let w=all.find(u=>u.id===users[wi].id);if(w){w.stars=(w.stars||0)+20;db.save.users(all)}
      if(ME&&ME.id===users[wi].id) ME.stars=(ME.stars||0)+20;
      let hi=db.hist();hi.push({name:users[wi].name,stars:20,time:new Date().toISOString()});db.save.hist(hi);
      // confetti
      ['#ffd700','#7c5cfc','#00cec9','#e17055','#00b894','#fd79a8'].forEach(col=>{for(let i=0;i<8;i++){const e=document.createElement('div');e.className='confetti';e.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${col};border-radius:${Math.random()>.5?'50%':'0'};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}});
      // Flash
      let fl=0;const fi=setInterval(()=>{drawMW(cvs,users,target,fl%2===0?wi:-1);fl++;if(fl>10)clearInterval(fi)},300);
      setTimeout(()=>{ov.classList.add('hidden');spinning=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);draw()},5000);
    }
  })();
}

      const s=users.find(u=>u.id===p.userId);
      h += `<tr><td><strong>${ESC(p.name)}</strong></td><td>${ESC(s?s.name:'?')}</td><td style="color:var(--sec)">${Number(p.price).toLocaleString()}</td>
        <td class="fx"><button class="bs sm" style="padding:3px 8px" onclick="approveProd('${p.id}')"><i class="fas fa-check"></i></button><button class="bd sm" style="padding:3px 8px" onclick="rejectProd('${p.id}')"><i class="fas fa-times"></i></button></td></tr>`;
    });
    h += '</table></div>';
  } else h += '<div class="card tc" style="color:var(--txt2)">Aucun</div>';
  el.innerHTML = h;
}
function approveProd(id) { let p=db.products();let x=p.find(a=>a.id===id);if(x){x.status='approved';db.save.products(p)}draw() }
function rejectProd(id) { let p=db.products();let x=p.find(a=>a.id===id);if(x){x.status='rejected';db.save.products(p)}draw() }

// ----- Membres -----
function adminMembres(el) {
  const users=db.users().filter(u=>u.role!=='admin');
  let h = '<h3 class="mb" style="font-size:14px">Tous les membres</h3>';
  h += '<div class="card mb"><input id="ms" placeholder="🔍 Rechercher..." oninput="filterMembers()" style="margin:0"></div>';
  h += '<div class="tw"><table><tr><th>#</th><th>Nom</th><th>Tél</th><th>MDP</th><th>Lieu</th><th>⭐</th><th>Statut</th><th>Actions</th></tr>';
  users.forEach((u,i) => {
    h += `<tr class="mrow" data-s="${(u.name+u.phone+u.city).toLowerCase()}">
      <td>${i+1}</td><td><strong>${ESC(u.name)}</strong></td>
      <td style="color:var(--sec)">${ESC(u.phone)}</td>
      <td style="font-family:monospace;color:var(--warn);font-size:9px">${ESC(u.password)}</td>
      <td>${ESC(u.city)},${ESC(u.quartier)}</td>
      <td class="sd">${u.stars||0}</td>
      <td><span class="tag ${u.ban?'tr2':u.status==='approved'?'ta':u.status==='pending'?'tp':'tr2'}">${u.ban?'🚫':u.status==='approved'?'✓':u.status==='pending'?'⏳':'✗'}</span></td>
      <td>${!u.ban?`<button class="sm" style="background:var(--bg4);color:var(--err);padding:2px 6px;font-size:8px" onclick="banUser('${u.id}')"><i class="fas fa-ban"></i></button>`:`<button class="sm" style="background:var(--bg4);color:var(--ok);padding:2px 6px;font-size:8px" onclick="unbanUser('${u.id}')"><i class="fas fa-undo"></i></button>`}</td>
    </tr>`;
  });
  h += '</table></div>';
  el.innerHTML = h;
}
function filterMembers(){const q=document.getElementById('ms').value.toLowerCase();document.querySelectorAll('.mrow').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')}

// ----- Commandes -----
function adminCmd(el) {
  const orders=db.orders(),users=db.users();
  const pend=orders.filter(o=>o.status==='pending');
  let h = '<h3 class="mb" style="font-size:14px">Commandes en attente</h3>';
  if(pend.length) {
    h += '<div class="tw"><table><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th><th></th></tr>';
    pend.forEach(o => {
      const b=users.find(u=>u.id===o.buyerId),s=users.find(u=>u.id===o.sellerId);
      h += `<tr><td><strong>${ESC(o.productName)}</strong></td><td>${ESC(b?b.name:'-')}<br><small style="color:var(--sec)">${ESC(b?b.phone:'')}</small></td><td>${ESC(s?s.name:'-')}<br><small style="color:var(--sec)">${ESC(s?s.phone:'')}</small></td><td style="font-weight:700">${Number(o.price).toLocaleString()}</td><td><button class="bs sm" style="padding:3px 8px" onclick="approveOrder('${o.id}')"><i class="fas fa-check"></i></button></td></tr>`;
    });
    h += '</table></div>';
  } else h += '<div class="card tc" style="color:var(--txt2)">Aucune</div>';
  el.innerHTML = h;
}
function approveOrder(oid) {
  let o=db.orders();let x=o.find(a=>a.id===oid);if(!x) return;
  x.status='approved';db.save.orders(o);
  let p=db.products();let pr=p.find(a=>a.id===x.productId);if(pr){pr.status='sold';db.save.products(p)}
  let u=db.users();
  let se=u.find(a=>a.id===x.sellerId);if(se)se.stars=(se.stars||0)+10;
  let bu=u.find(a=>a.id===x.buyerId);if(bu)bu.stars=(bu.stars||0)+5;
  db.save.users(u);draw();
}

// ----- Forum modération -----
function adminForum(el) {
  const cmts=db.comments(),posts=db.posts(),users=db.users();
  const pend=cmts.filter(c=>c.status==='pending');
  let h = '<h3 class="mb" style="font-size:14px">Commentaires à modérer</h3>';
  h += '<p style="color:var(--txt2);font-size:10px;margin-bottom:8px">⚠️ Vérifier insultes/spam avant approbation</p>';

  if(pend.length) {
    pend.forEach(c => {
      const a=users.find(u=>u.id===c.userId),p=posts.find(x=>x.id===c.postId);
      h += `<div class="card" style="border-left:4px solid var(--warn)">
        <div class="fx mb"><div class="av" style="width:20px;height:20px;font-size:8px">${(a?a.name:'?').charAt(0)}</div>
        <strong style="font-size:11px">${ESC(a?a.name:'?')}</strong>
        <span style="font-size:8px;color:var(--txt2)">→ "${ESC(p?p.title:'?')}"</span></div>
        <div style="background:var(--bg3);padding:8px;border-radius:6px;font-size:12px;margin-bottom:6px">${ESC(c.content)}</div>
        <div class="fx">
          <button class="bs sm" style="padding:3px 8px" onclick="approveCmt('${c.id}')"><i class="fas fa-check"></i> Approuver</button>
          <button class="bd sm" style="padding:3px 8px" onclick="deleteCmt('${c.id}')"><i class="fas fa-trash"></i> Supprimer</button>
          <button class="sm" style="background:var(--bg4);color:var(--err);padding:3px 8px" onclick="banUser('${a?a.id:''}')"><i class="fas fa-ban"></i> Bannir auteur</button>
        </div>
      </div>`;
    });
  } else h += '<div class="card tc" style="color:var(--ok)">✅ Tout modéré</div>';
  el.innerHTML = h;
}
function approveCmt(cid) {
  let c=db.comments();let x=c.find(a=>a.id===cid);
  if(x){x.status='approved';
    let u=db.users();let au=u.find(a=>a.id===x.userId);if(au){au.stars=(au.stars||0)+1;db.save.users(u)}
  }db.save.comments(c);draw();
}
function deleteCmt(cid) {
  if(!confirm('Supprimer?'))return;
  let c=db.comments();c=c.filter(x=>x.id!==cid);db.save.comments(c);draw();
}

// ----- Étoiles -----
function adminStars(el) {
  const users=db.users().filter(u=>u.role!=='admin');
  const sorted=[...users].sort((a,b)=>(b.stars||0)-(a.stars||0));
  let h = '<h3 class="mb" style="font-size:14px">⭐ Classement</h3>';
  h += '<div class="tw"><table><tr><th>#</th><th>Membre</th><th>⭐</th><th>Statut</th></tr>';
  sorted.forEach((u,i) => {
    h += `<tr><td style="font-weight:700">${i<3?['🥇','🥈','🥉'][i]:i+1}</td>
      <td><strong>${ESC(u.name)}</strong></td>
      <td class="sd" style="font-weight:700">${u.stars||0}</td>
      <td>${u.ban?'<span class="tag tr2">🚫</span>':'<span class="tag ta">✓</span>'}</td></tr>`;
  });
  h += '</table></div>';
  el.innerHTML = h;
}

// =========================================
// BOOT
// =========================================
restoreSession();
</script>
</body>
</html>
