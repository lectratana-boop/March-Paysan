<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--bg4:#252550;--pri:#7c5cfc;--pri2:#9b7dff;--sec:#00cec9;--ok:#00b894;--warn:#fdcb6e;--err:#e17055;--txt:#e8e8ff;--txt2:#a0a0c0;--gold:#ffd700;--r:12px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;border-radius:var(--r);padding:10px 20px;font-size:14px;font-weight:600;transition:.3s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
input,textarea,select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:12px 16px;color:var(--txt);font-size:14px;width:100%;margin-bottom:12px}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 10px rgba(124,92,252,.3)}
.bp{background:linear-gradient(135deg,var(--pri),#5a3fd4);color:#fff}
.bs{background:linear-gradient(135deg,var(--ok),#00a381);color:#fff}
.bd{background:linear-gradient(135deg,var(--err),#d63031);color:#fff}
.bw{background:linear-gradient(135deg,var(--warn),#f0b429);color:#222}
.bt{background:linear-gradient(135deg,var(--sec),#00a8a3);color:#fff}
.sm{padding:6px 14px;font-size:12px}
.xs{padding:4px 10px;font-size:11px}
.bk{width:100%;display:block}
.hidden{display:none!important}
.badge{background:var(--err);color:#fff;border-radius:50%;font-size:10px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:18px;margin-bottom:14px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.tp{background:rgba(253,203,110,.15);color:var(--warn)}
.ta{background:rgba(0,184,148,.15);color:var(--ok)}
.tr{background:rgba(225,112,85,.15);color:var(--err)}
.fx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tc{text-align:center}
.mt2{margin-top:16px}.mt3{margin-top:24px}.mb2{margin-bottom:16px}
.sd{color:var(--gold)}
label.fl{font-size:11px;color:var(--txt2);display:block;margin-bottom:3px}

/* AUTH */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a,#1a1040,#0a0a1a);padding:16px}
.abox{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:30px;width:100%;max-width:400px}
.abox h1{text-align:center;margin-bottom:6px;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:24px}
.abox .sub{text-align:center;color:var(--txt2);margin-bottom:16px;font-size:13px}
.atb{display:flex;margin-bottom:16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bg4)}
.atb div{flex:1;padding:11px;text-align:center;background:var(--bg);color:var(--txt2);cursor:pointer;font-weight:600;font-size:13px}
.atb div.active{background:var(--pri);color:#fff}
.amsg{padding:12px;border-radius:var(--r);margin-bottom:12px;font-size:12px;text-align:center;line-height:1.6}
.amsg.ok{background:rgba(0,184,148,.15);color:var(--ok);border:1px solid rgba(0,184,148,.3)}
.amsg.err{background:rgba(225,112,85,.15);color:var(--err);border:1px solid rgba(225,112,85,.3)}
.amsg.warn{background:rgba(253,203,110,.15);color:var(--warn);border:1px solid rgba(253,203,110,.3)}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--bg4);padding:0 14px;position:sticky;top:0;z-index:100}
.hdr{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;gap:6px}
.logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--pri2),var(--sec));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--txt2);padding:6px 9px;font-size:10px;border-radius:8px;position:relative;white-space:nowrap}
.nav button:hover{background:var(--bg3);color:var(--txt);transform:none}
.nav button.active{background:var(--pri);color:#fff}
.nav button .nb{position:absolute;top:-5px;right:-5px;font-size:8px;min-width:16px;height:16px;background:var(--err);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pls .8s infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.hr{display:flex;align-items:center;gap:7px;flex-shrink:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:#fff}
.bell{position:relative;background:transparent;color:var(--txt2);font-size:17px;padding:5px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bell:hover{background:var(--bg3)}
.bell .badge{position:absolute;top:-4px;right:-4px;animation:pls .8s infinite}

/* LIVE PULSE - proves polling is alive */
#livePulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:livep 1s infinite;margin-right:4px}
@keyframes livep{0%,100%{opacity:1;box-shadow:0 0 4px var(--ok)}50%{opacity:.3;box-shadow:none}}

/* URGENT BANNER - always visible when pending */
#urgentBanner{position:fixed;top:56px;left:0;right:0;z-index:99;background:linear-gradient(90deg,#ff6b6b,#ffd700,#ff6b6b);background-size:200% 100%;animation:bannerSlide 2s linear infinite;padding:10px 20px;text-align:center;cursor:pointer;font-weight:800;color:#000;font-size:14px;box-shadow:0 4px 20px rgba(255,107,107,.4)}
@keyframes bannerSlide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
#urgentBanner:hover{filter:brightness(1.1)}

/* URGENT FULLSCREEN */
#urgentFS{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9000;background:rgba(10,10,26,.95);display:flex;align-items:center;justify-content:center}
.ubox{background:var(--bg2);border:3px solid var(--gold);border-radius:20px;padding:28px;max-width:400px;width:90%;text-align:center;animation:popIn .3s ease;box-shadow:0 0 80px rgba(255,215,0,.3)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.uico{font-size:60px;margin-bottom:10px;animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* NOTIF DROPDOWN */
.ndrop{position:absolute;top:calc(100% + 6px);right:-30px;width:300px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:200;max-height:400px;overflow-y:auto}
.ndrop h3{padding:10px 14px;border-bottom:1px solid var(--bg4);font-size:12px;margin:0}
.nitem{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.nitem:hover{background:var(--bg3)}
.nico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
.nico.or{background:rgba(253,203,110,.2);color:var(--warn)}
.nico.bl{background:rgba(124,92,252,.2);color:var(--pri2)}
.nico.rd{background:rgba(225,112,85,.2);color:var(--err)}
.nico.gn{background:rgba(0,184,148,.2);color:var(--ok)}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:18px}
.pgt{font-size:18px;font-weight:700;margin-bottom:3px}
.pgs{color:var(--txt2);font-size:11px;margin-bottom:18px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:18px}
.stt{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:12px;text-align:center}
.stt .si{font-size:18px;margin-bottom:2px}.stt .sv{font-size:20px;font-weight:800}.stt .sl{color:var(--txt2);font-size:9px;margin-top:2px}
.ats{display:flex;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--bg4);padding-bottom:4px}
.ats::-webkit-scrollbar{display:none}
.at{padding:7px 10px;border-radius:8px 8px 0 0;background:transparent;color:var(--txt2);font-size:10px;font-weight:600;white-space:nowrap}
.at:hover{background:var(--bg3);color:var(--txt);transform:none}
.at.active{background:var(--bg3);color:var(--pri2);border-bottom:2px solid var(--pri)}
.at .badge{margin-left:3px;font-size:8px;min-width:14px;height:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--bg4);font-size:10px}
th{color:var(--txt2);font-weight:600;background:var(--bg3);white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pc{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);overflow:hidden;transition:.3s}
.pc:hover{border-color:var(--pri);transform:translateY(-2px)}
.pimg{height:100px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--txt2);position:relative}
.pi{padding:10px}.pi h3{font-size:12px}.pi .pr{color:var(--sec);font-size:15px;font-weight:800;margin:3px 0}
.po{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cm{background:var(--bg3);border-radius:8px;padding:8px;margin:4px 0 4px 14px;border-left:3px solid var(--pri);font-size:11px}
.prof{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:26px;text-align:center;max-width:480px;margin:0 auto}
.pav{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 10px;color:#fff}
.pbar{background:var(--bg);border-radius:20px;height:16px;overflow:hidden;margin:8px 0}
.pfill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pri),var(--gold));display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;min-width:25px;color:#fff;transition:.5s}

/* MEGA WHEEL */
#mwOv{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,15,.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mwp{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--gold);filter:drop-shadow(0 2px 8px rgba(255,215,0,.6))}
.wglow{animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 25px var(--gold)}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;z-index:10000;animation:confetti 3s ease-in-out forwards}

@media(max-width:768px){.sts{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:1fr}main{padding:10px}.abox{padding:20px}.ndrop{right:-60px;width:260px}.logo{font-size:13px}.nav button{font-size:9px;padding:5px 6px}.prof{padding:16px}canvas.mwc{width:260px!important;height:260px!important}#urgentBanner{font-size:12px;padding:8px 14px}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
<div class="abox">
<h1><i class="fas fa-store"></i> MadaMarket</h1>
<p class="sub">Marketplace Madagascar</p>
<div id="amsg"></div>
<div class="atb"><div class="active" onclick="aTab('login')">Connexion</div><div onclick="aTab('register')">Inscription</div></div>
<div id="f-login">
<label class="fl"><i class="fas fa-phone"></i> Téléphone</label>
<input type="tel" id="lph" placeholder="034 XX XXX XX">
<label class="fl"><i class="fas fa-lock"></i> Mot de passe</label>
<input type="password" id="lpw" placeholder="Mot de passe">
<button class="bp bk" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Connexion</button>
</div>
<div id="f-reg" class="hidden">
<div style="background:var(--bg3);border-radius:var(--r);padding:10px;margin-bottom:12px;font-size:10px;color:var(--txt2);line-height:1.5">
1️⃣ Remplir ci-dessous → 2️⃣ Admin valide → 3️⃣ Connexion avec tél + mdp
</div>
<label class="fl">Nom complet *</label><input id="rn" placeholder="Nom">
<label class="fl">Téléphone *</label><input type="tel" id="rp" placeholder="034 XX XXX XX">
<label class="fl">Mot de passe *</label><input type="password" id="rpw" placeholder="Min 4 caractères">
<label class="fl">Ville *</label><input id="rc" placeholder="Antananarivo">
<label class="fl">Quartier *</label><input id="rq" placeholder="Analakely">
<button class="bp bk" onclick="doReg()"><i class="fas fa-user-plus"></i> S'inscrire</button>
</div>
<div style="margin-top:12px;text-align:center;border-top:1px solid var(--bg4);padding-top:8px">
<button class="xs bd" onclick="resetAll()" style="opacity:.4;font-size:9px"><i class="fas fa-trash"></i> Réinitialiser</button>
</div>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header><div class="hdr">
<div class="logo"><i class="fas fa-store"></i> MadaMarket</div>
<div class="nav" id="nav"></div>
<div class="hr">
<div id="livePulse" title="Surveillance active"></div>
<span style="font-size:11px"><i class="fas fa-star" style="color:var(--gold)"></i> <span id="hst">0</span></span>
<div style="position:relative" id="bw">
<button class="bell" onclick="tglN()"><i class="fas fa-bell"></i><span class="badge hidden" id="bbg">0</span></button>
<div class="ndrop hidden" id="ndrop"></div>
</div>
<div class="av" id="hav">A</div>
<span id="hnm" style="font-size:10px"></span>
<button class="xs bd" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
</div>
</div></header>
<!-- Urgent banner placeholder - inserted dynamically -->
<div id="bannerSlot"></div>
<main id="ct"></main>
</div>

<!-- MEGA WHEEL OVERLAY -->
<div id="mwOv" class="hidden">
<div style="text-align:center;padding:10px">
<div style="font-size:22px;font-weight:800;color:var(--gold);margin-bottom:4px"><i class="fas fa-trophy"></i> MEGA WHEEL</div>
<div style="color:var(--txt2);font-size:12px;margin-bottom:14px">20 ⭐ à gagner!</div>
<div style="position:relative;display:inline-block">
<div class="mwp"></div>
<canvas id="mwCanvas" class="mwc" width="340" height="340" style="border-radius:50%"></canvas>
</div>
<div id="mwRes" style="font-size:16px;margin-top:14px;min-height:30px"></div>
</div>
</div>

<!-- URGENT FS -->
<div id="urgentFS" class="hidden"></div>

<script>
// ============ STORAGE ============
function LS(k){try{return JSON.parse(localStorage.getItem('mm_'+k))||[]}catch{return[]}}
function SS(k,v){localStorage.setItem('mm_'+k,JSON.stringify(v))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,6);
const fd=d=>d?new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const esc=s=>{if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const np=p=>(p||'').replace(/[\s\-\.]/g,'');
const ci=c=>({Électronique:'laptop',Vêtements:'tshirt',Maison:'home',Alimentation:'utensils',Services:'handshake'}[c]||'box');
const mdT=()=>{const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000)};

// ============ STATE ============
let U=null, pg='accueil', at='notifs';
// Track last known counts separately per category
let lastCounts={reg:0,prod:0,cmt:0,ord:0,wdr:0,total:0};
let urgentShown=false;

// ============ PENDING COUNT - reads fresh from localStorage every call ============
function getPending(){
  // ALWAYS read fresh from localStorage
  const users=JSON.parse(localStorage.getItem('mm_users')||'[]');
  const products=JSON.parse(localStorage.getItem('mm_products')||'[]');
  const comments=JSON.parse(localStorage.getItem('mm_comments')||'[]');
  const orders=JSON.parse(localStorage.getItem('mm_orders')||'[]');
  const r={
    reg:users.filter(x=>x.status==='pending'&&x.role!=='admin').length,
    prod:products.filter(x=>x.status==='pending').length,
    cmt:comments.filter(x=>x.status==='pending').length,
    ord:orders.filter(x=>x.status==='pending').length,
    wdr:users.filter(x=>x.withdrawReq).length
  };
  r.total=r.reg+r.prod+r.cmt+r.ord+r.wdr;
  return r;
}

// ============ MASTER POLLING - 300ms - THE ONLY NOTIFICATION SYSTEM ============
setInterval(function(){
  if(!U)return;
  if(U.role!=='admin')return;

  const p=getPending();

  // Update badge always
  const bb=document.getElementById('bbg');
  if(bb){
    if(p.total>0){bb.textContent=p.total;bb.classList.remove('hidden')}
    else{bb.classList.add('hidden')}
  }

  // Update banner always
  updateBanner(p);

  // Check if counts increased
  if(p.total>lastCounts.total){
    console.log('🔔 NEW NOTIFICATION! was:'+lastCounts.total+' now:'+p.total);
    beep();
    if(!urgentShown){
      urgentShown=true;
      showUrgentFS(p);
    }
    buildNav();
    // If on admin page, refresh it
    if(pg==='admin'){
      const ac=document.getElementById('atc');
      if(ac)renderAdminTab(ac);
    }
  }

  // If counts changed at all (decreased = admin handled something)
  if(p.total!==lastCounts.total){
    buildNav();
  }

  lastCounts={...p};
},300);

// ============ PERSISTENT BANNER ============
function updateBanner(p){
  const slot=document.getElementById('bannerSlot');
  if(!slot)return;
  if(!U||U.role!=='admin'){slot.innerHTML='';return}
  if(p.total===0){slot.innerHTML='';return}

  let parts=[];
  if(p.reg)parts.push('👤'+p.reg+' inscription(s)');
  if(p.prod)parts.push('📦'+p.prod+' produit(s)');
  if(p.cmt)parts.push('💬'+p.cmt+' commentaire(s)');
  if(p.ord)parts.push('🛒'+p.ord+' commande(s)');
  if(p.wdr)parts.push('💰'+p.wdr+' retrait(s)');

  slot.innerHTML=`<div id="urgentBanner" onclick="go('admin');at='${p.reg?'inscriptions':p.prod?'produits':p.cmt?'forum':'notifs'}';render()">
    🔔 ${parts.join(' | ')} — CLIQUEZ POUR GÉRER
  </div>`;
}

// ============ URGENT FULLSCREEN ============
function showUrgentFS(p){
  let parts=[];
  if(p.reg)parts.push(`👤 ${p.reg} inscription(s) en attente`);
  if(p.prod)parts.push(`📦 ${p.prod} produit(s) à approuver`);
  if(p.cmt)parts.push(`💬 ${p.cmt} commentaire(s) à modérer`);
  if(p.ord)parts.push(`🛒 ${p.ord} commande(s) à valider`);
  if(p.wdr)parts.push(`💰 ${p.wdr} retrait(s) à valider`);
  const tab=p.reg?'inscriptions':p.prod?'produits':p.cmt?'forum':p.ord?'commandes':'etoiles';

  document.getElementById('urgentFS').innerHTML=`
    <div class="ubox">
      <div class="uico">🔔</div>
      <div style="font-size:18px;font-weight:800;color:var(--gold);margin-bottom:8px">NOTIFICATION!</div>
      <div style="color:var(--txt);font-size:14px;margin-bottom:16px;line-height:1.8">${parts.join('<br>')}</div>
      <button class="bw" onclick="closeFS();at='${tab}';go('admin')" style="font-size:16px;padding:14px 30px"><i class="fas fa-arrow-right"></i> GÉRER</button>
      <br><button class="xs" style="background:none;color:var(--txt2);margin-top:8px" onclick="closeFS()">Fermer</button>
    </div>`;
  document.getElementById('urgentFS').classList.remove('hidden');
  setTimeout(closeFS,15000);
}

function closeFS(){
  document.getElementById('urgentFS').classList.add('hidden');
  document.getElementById('urgentFS').innerHTML='';
  urgentShown=false;
}

// ============ SOUND ============
function beep(){
try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.3;o.frequency.value=880;o.type='sine';o.start();o.frequency.linearRampToValueAtTime(1320,c.currentTime+.15);g.gain.linearRampToValueAtTime(0,c.currentTime+.4);o.stop(c.currentTime+.4)}catch(e){}}
function tick(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.08;o.frequency.value=500+Math.random()*300;o.type='square';o.start();g.gain.linearRampToValueAtTime(0,c.currentTime+.02);o.stop(c.currentTime+.02)}catch(e){}}

// ============ MEGA WHEEL ============
const WCOL=['#7c5cfc','#00cec9','#e17055','#00b894','#fdcb6e','#fd79a8','#6c5ce7','#74b9ff','#a29bfe','#ff7675','#55efc4','#fab1a0','#81ecec','#ffeaa7'];
function drawW(cvs,members,angle,hiIdx){
const ctx=cvs.getContext('2d');const W=cvs.width,H=cvs.height,cx=W/2,cy=H/2,R=Math.min(cx,cy)-20;
ctx.clearRect(0,0,W,H);
const n=members.length,seg=Math.PI*2/n;
// Outer LEDs
for(let i=0;i<32;i++){const la=i*Math.PI*2/32+angle*.15;const lx=cx+(R+12)*Math.cos(la),ly=cy+(R+12)*Math.sin(la);ctx.beginPath();ctx.arc(lx,ly,3,0,Math.PI*2);ctx.fillStyle=i%3===0?'#ffd700':i%3===1?'#ff6b6b':'#7c5cfc';ctx.fill()}
// Segments
for(let i=0;i<n;i++){const a1=i*seg+angle-Math.PI/2,a2=a1+seg;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a1,a2);ctx.closePath();ctx.fillStyle=WCOL[i%WCOL.length];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.stroke();
if(hiIdx===i){ctx.fillStyle='rgba(255,215,0,.4)';ctx.fill();ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.stroke()}
ctx.save();ctx.translate(cx,cy);ctx.rotate(a1+seg/2);ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(12,220/n)}px sans-serif`;ctx.textAlign='right';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=3;ctx.fillText(members[i].name.substring(0,8),R-12,0);ctx.shadowBlur=0;ctx.restore()}
// Center
ctx.beginPath();ctx.arc(cx,cy,R*.14,0,Math.PI*2);const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.14);ig.addColorStop(0,'#ffd700');ig.addColorStop(1,'#cc9900');ctx.fillStyle=ig;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MEGA',cx,cy-4);ctx.font='bold 7px sans-serif';ctx.fillText('WHEEL',cx,cy+5);
}

const cvs=document.getElementById('mwCanvas');
const dur=8000,t0=Date.now();let lastSeg=-1;
(function spin(){const elapsed=Date.now()-t0;const t=Math.min(1,elapsed/dur);const e=1-Math.pow(1-t,4);const angle=e*totalSpin;
drawW(cvs,users,angle,t>=1?winIdx:-1);
const curSeg=Math.floor((((-angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2))/segA);if(curSeg!==lastSeg){tick();lastSeg=curSeg}
if(t<1)requestAnimationFrame(spin);
else{beep();
res.innerHTML=`<div style="animation:pls 1s infinite;color:var(--gold)">🎉 ${esc(users[winIdx].name)} gagne 20⭐! 🎉</div>`;
let all=LS('users');let w=all.find(u=>u.id===users[winIdx].id);if(w){w.stars=(w.stars||0)+20;SS('users',all)}
if(U&&U.id===users[winIdx].id)U.stars=(U.stars||0)+20;
let hi=LS('rHist');hi.push({id:users[winIdx].id,name:users[winIdx].name,stars:20,time:new Date().toISOString()});SS('rHist',hi);
confetti();
let fl=0;const fi=setInterval(()=>{drawW(cvs,users,totalSpin,fl%2===0?winIdx:-1);fl++;if(fl>12)clearInterval(fi)},250);
setTimeout(()=>{ov.classList.add('hidden');mwR=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);render()},6000)}})();
}
function confetti(){const c=['#ffd700','#7c5cfc','#00cec9','#e17055','#00b894','#fd79a8'];for(let i=0;i<50;i++){const e=document.createElement('div');e.className='confetti';e.style.cssText=`left:${Math.random()*100}vw;width:${5+Math.random()*10}px;height:${5+Math.random()*10}px;background:${c[Math.floor(Math.random()*c.length)]};border-radius:${Math.random()>.5?'50%':'0'};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s;`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

// ============ ADMIN ============
function rAdm(ct){
if(U.role!=='admin'){ct.innerHTML='Accès refusé';return}
const p=getPending();
let h='<h1 class="pgt"><i class="fas fa-shield-alt"></i> Admin</h1><div class="sts">'+st('user-clock','err',p.reg,'Inscrip.')+st('box','pri2',p.prod,'Produits')+st('shopping-cart','sec',p.ord,'Cmd')+st('comment-dots','gold',p.cmt,'Com.')+st('money-bill-wave','ok',p.wdr,'Retraits')+'</div>';
const tabs=[{id:'notifs',ic:'bell',lb:'Notif',b:p.total},{id:'inscriptions',ic:'user-clock',lb:'Inscrip.',b:p.reg},{id:'produits',ic:'box',lb:'Produits',b:p.prod},{id:'membres',ic:'users',lb:'Membres'},{id:'commandes',ic:'shopping-cart',lb:'Cmd',b:p.ord},{id:'forum',ic:'comments',lb:'Forum',b:p.cmt},{id:'etoiles',ic:'star',lb:'⭐',b:p.wdr}];
h+='<div class="ats">';tabs.forEach(t=>{h+=`<button class="at ${at===t.id?'active':''}" onclick="at='${t.id}';render()"><i class="fas fa-${t.ic}"></i> ${t.lb}`;if(t.b&&t.b>0)h+=`<span class="badge">${t.b}</span>`;h+='</button>'});h+='</div><div id="atc"></div>';ct.innerHTML=h;
renderAdminTab(document.getElementById('atc'));
}

function renderAdminTab(ac){
  if(!ac)return;
  ({notifs:aN,inscriptions:aI,produits:aP,membres:aM,commandes:aO,forum:aF,etoiles:aS}[at]||aN)(ac);
}

function aN(el){const p=getPending();let h='<h2 class="mb2" style="font-size:15px">🔔 Notifications</h2>';if(!p.total)h+='<div class="card tc" style="color:var(--ok);padding:24px">✅ Tout à jour!</div>';
else{if(p.reg)h+=nc('user-clock','warn',p.reg+' inscription(s)','VALIDER','inscriptions','bw');if(p.prod)h+=nc('box','pri',p.prod+' produit(s)','Approuver','produits','bp');if(p.cmt)h+=nc('comment-dots','err',p.cmt+' commentaire(s)','Modérer','forum','bd');if(p.ord)h+=nc('shopping-cart','ok',p.ord+' commande(s)','Approuver','commandes','bt');if(p.wdr)h+=nc('money-bill-wave','warn',p.wdr+' retrait(s)','Valider','etoiles','bw')}el.innerHTML=h}
function nc(ic,col,txt,btn,tab,cls){return`<div class="card fb" style="border-left:4px solid var(--${col})"><div class="fx"><div class="nico ${col==='warn'?'or':col==='pri'?'bl':col==='err'?'rd':'gn'}"><i class="fas fa-${ic}"></i></div><strong style="font-size:13px">${txt}</strong></div><button class="${cls} sm" onclick="at='${tab}';render()">${btn} →</button></div>`}

function aI(el){
const users=LS('users').filter(u=>u.role!=='admin');const pend=users.filter(u=>u.status==='pending');
let h='<h2 class="mb2" style="font-size:15px">👤 Inscriptions</h2>';
if(pend.length){pend.forEach(u=>{h+=`<div class="card" style="border-left:4px solid var(--warn)">
<div class="fb mb2"><div class="fx"><div class="av">${u.name.charAt(0)}</div><strong>${esc(u.name)}</strong></div><span class="tag tp">⏳</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;font-size:11px">
<div class="card" style="margin:0;padding:8px"><small style="color:var(--txt2)">📱 Tél</small><div style="font-weight:700;color:var(--sec)">${esc(u.phone)}</div></div>
<div class="card" style="margin:0;padding:8px"><small style="color:var(--txt2)">🔑 MDP</small><div style="font-weight:700;color:var(--gold);font-family:monospace">${esc(u.password||'-')}</div></div>
<div class="card" style="margin:0;padding:8px"><small style="color:var(--txt2)">🏙️</small><div>${esc(u.city||'-')}</div></div>
<div class="card" style="margin:0;padding:8px"><small style="color:var(--txt2)">🏠</small><div>${esc(u.quartier||'-')}</div></div></div>
<div class="fx"><button class="bs" onclick="valU('${u.id}')"><i class="fas fa-check-circle"></i> VALIDER</button><button class="bd sm" onclick="rejU('${u.id}')"><i class="fas fa-times"></i></button></div></div>`})}
else h+='<div class="card tc" style="color:var(--ok)">✅ Aucune</div>';
const done=users.filter(u=>u.status!=='pending');
if(done.length){h+='<h3 class="mt3 mb2" style="font-size:13px">Traités</h3><div class="tw"><table><tr><th>Nom</th><th>Tél</th><th>Statut</th></tr>';done.forEach(u=>{h+=`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td><span class="tag ${u.status==='approved'?'ta':'tr'}">${u.status==='approved'?'✓':'✗'}</span></td></tr>`});h+='</table></div>'}el.innerHTML=h}
function valU(uid){let u=LS('users');let x=u.find(a=>a.id===uid);if(x){x.status='approved';SS('users',u)}render()}
function rejU(uid){if(!confirm('Refuser?'))return;let u=LS('users');let x=u.find(a=>a.id===uid);if(x){x.status='rejected';SS('users',u)}render()}

function aP(el){const prods=LS('products'),users=LS('users');const pend=prods.filter(p=>p.status==='pending'),appr=prods.filter(p=>p.status==='approved');
let h='<h2 class="mb2" style="font-size:15px">📦 Produits</h2>';
if(pend.length){h+='<div class="tw"><table><tr><th>Produit</th><th>Vendeur</th><th>Prix</th><th></th></tr>';pend.forEach(p=>{const s=users.find(u=>u.id===p.userId);h+=`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(s?s.name:'?')}</td><td style="color:var(--sec)">${Number(p.price).toLocaleString()}</td><td class="fx"><button class="bs xs" onclick="vP('${p.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="rP('${p.id}')"><i class="fas fa-times"></i></button></td></tr>`});h+='</table></div>'}
else h+='<div class="card tc" style="color:var(--txt2)">Aucun</div>';
if(appr.length){h+=`<h3 class="mt3 mb2" style="font-size:12px">Approuvés (${appr.length})</h3><div class="tw"><table><tr><th>Produit</th><th>Vendeur</th><th>Prix</th></tr>`;appr.forEach(p=>{const s=users.find(u=>u.id===p.userId);h+=`<tr><td>${esc(p.name)}</td><td>${esc(s?s.name:'-')}</td><td>${Number(p.price).toLocaleString()}</td></tr>`});h+='</table></div>'}el.innerHTML=h}
function vP(i){let p=LS('products');let x=p.find(a=>a.id===i);if(x){x.status='approved';SS('products',p)}render()}
function rP(i){if(!confirm('Refuser?'))return;let p=LS('products');let x=p.find(a=>a.id===i);if(x){x.status='rejected';SS('products',p)}render()}

function aM(el){const users=LS('users').filter(u=>u.role!=='admin');
let h='<h2 class="mb2" style="font-size:15px">👥 Membres</h2><div class="card mb2"><input id="ms" placeholder="🔍 Rechercher..." oninput="fM()" style="margin:0"></div>';
h+='<div class="tw"><table><tr><th>#</th><th>Nom</th><th>Tél</th><th>MDP</th><th>Lieu</th><th>⭐</th><th>●</th></tr>';
users.forEach((u,i)=>{h+=`<tr class="mr" data-s="${(u.name+(u.phone||'')+(u.city||'')).toLowerCase()}"><td>${i+1}</td><td><strong>${esc(u.name)}</strong></td><td style="color:var(--sec)">${esc(u.phone)}</td><td style="font-family:monospace;color:var(--warn);font-size:9px">${u.password||'-'}</td><td>${esc(u.city||'-')}</td><td class="sd">${u.stars||0}</td><td>${u.isActive?'<span style="color:var(--ok)">●</span>':'○'}</td></tr>`});
h+='</table></div>';el.innerHTML=h}
function fM(){const q=document.getElementById('ms').value.toLowerCase();document.querySelectorAll('.mr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')}

function aO(el){const ords=LS('orders'),users=LS('users');const pend=ords.filter(o=>o.status==='pending'),appr=ords.filter(o=>o.status==='approved');
let h='<h2 class="mb2" style="font-size:15px">🛒 Commandes</h2>';
if(pend.length){h+='<div class="tw"><table><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th><th></th></tr>';pend.forEach(o=>{const b=users.find(u=>u.id===o.buyerId),s=users.find(u=>u.id===o.sellerId);h+=`<tr><td><strong>${esc(o.productName)}</strong></td><td>${esc(b?b.name:'-')}</td><td>${esc(s?s.name:'-')}</td><td style="font-weight:700">${Number(o.price).toLocaleString()}</td><td><button class="bs xs" onclick="vO('${o.id}')"><i class="fas fa-check"></i></button></td></tr>`});h+='</table></div>'}
else h+='<div class="card tc" style="color:var(--txt2)">Aucune</div>';
if(appr.length){h+=`<h3 class="mt3 mb2" style="font-size:12px">Approuvées (${appr.length})</h3><div class="tw"><table><tr><th>Produit</th><th>Acheteur</th><th>Vendeur</th><th>Prix</th></tr>`;appr.forEach(o=>{const b=users.find(u=>u.id===o.buyerId),s=users.find(u=>u.id===o.sellerId);h+=`<tr><td>${esc(o.productName)}</td><td>${esc(b?b.name:'-')}</td><td>${esc(s?s.name:'-')}</td><td>${Number(o.price).toLocaleString()}</td></tr>`});h+='</table></div>'}el.innerHTML=h}
function vO(oid){let o=LS('orders');let x=o.find(a=>a.id===oid);if(!x)return;x.status='approved';SS('orders',o);let p=LS('products');let pr=p.find(a=>a.id===x.productId);if(pr){pr.status='sold';SS('products',p)}let u=LS('users');let se=u.find(a=>a.id===x.sellerId),bu=u.find(a=>a.id===x.buyerId);if(se)se.stars=(se.stars||0)+10;if(bu)bu.stars=(bu.stars||0)+5;SS('users',u);render()}

function aF(el){const cmts=LS('comments'),posts=LS('posts'),users=LS('users');const pend=cmts.filter(c=>c.status==='pending'),appr=cmts.filter(c=>c.status==='approved');
let h='<h2 class="mb2" style="font-size:15px">💬 Modération</h2>';
if(pend.length){pend.forEach(c=>{const a=users.find(u=>u.id===c.userId),p=posts.find(x=>x.id===c.postId);
h+=`<div class="card" style="border-left:4px solid var(--warn)"><div class="fb"><div class="fx"><div class="av" style="width:22px;height:22px;font-size:8px">${(a?a.name:'?').charAt(0)}</div><strong style="font-size:11px">${esc(a?a.name:'?')}</strong></div><span style="font-size:8px;color:var(--txt2)">sur "${esc(p?p.title:'?')}"</span></div>
<div style="background:var(--bg3);padding:8px;border-radius:8px;margin:6px 0;font-size:12px">${esc(c.content)}</div>
<div class="fx"><button class="bs xs" onclick="vC('${c.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="dC('${c.id}')"><i class="fas fa-trash"></i></button></div></div>`})}
else h+='<div class="card tc" style="color:var(--ok)">✅ Modéré</div>';
if(appr.length){h+=`<h3 class="mt3 mb2" style="font-size:12px">Approuvés (${appr.length})</h3><div class="tw"><table><tr><th>Auteur</th><th>Post</th><th>Texte</th></tr>`;appr.slice().reverse().slice(0,8).forEach(c=>{const a=users.find(u=>u.id===c.userId),p=posts.find(x=>x.id===c.postId);h+=`<tr><td>${esc(a?a.name:'-')}</td><td>${esc(p?p.title:'-')}</td><td style="max-width:120px">${esc(c.content)}</td></tr>`});h+='</table></div>'}el.innerHTML=h}
function vC(cid){let c=LS('comments');let x=c.find(a=>a.id===cid);if(x){x.status='approved';let u=LS('users');let au=u.find(a=>a.id===x.userId);if(au){au.stars=(au.stars||0)+1;SS('users',u)}}SS('comments',c);render()}
function dC(cid){if(!confirm('Supprimer?'))return;let c=LS('comments');c=c.filter(x=>x.id!==cid);SS('comments',c);render()}

function aS(el){const users=LS('users').filter(u=>u.role!=='admin');const sorted=[...users].sort((a,b)=>(b.stars||0)-(a.stars||0));const wdrs=users.filter(u=>u.withdrawReq);
let h='<h2 class="mb2" style="font-size:15px">⭐ Étoiles</h2>';
if(wdrs.length){wdrs.forEach(u=>{h+=`<div class="card fb" style="border-left:4px solid var(--gold)"><div class="fx"><div class="av">${u.name.charAt(0)}</div><div><strong>${esc(u.name)}</strong><div class="sd">${u.stars}⭐</div></div></div><div class="fx"><button class="bs sm" onclick="vW('${u.id}')"><i class="fas fa-check"></i></button><button class="bd xs" onclick="rW2('${u.id}')"><i class="fas fa-times"></i></button></div></div>`})}
h+='<h3 class="mt2 mb2" style="font-size:12px">Classement</h3><div class="tw"><table><tr><th>#</th><th>Membre</th><th>⭐</th></tr>';
sorted.forEach((u,i)=>{h+=`<tr><td style="font-weight:700">${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><strong>${esc(u.name)}</strong></td><td class="sd" style="font-weight:700">${u.stars||0}</td></tr>`});
h+='</table></div>';el.innerHTML=h}
function vW(uid){if(!confirm('Retrait? ⭐→0'))return;let u=LS('users');let x=u.find(a=>a.id===uid);if(x){x.stars=0;x.withdrawReq=false;SS('users',u)}render()}
function rW2(uid){let u=LS('users');let x=u.find(a=>a.id===uid);if(x){x.withdrawReq=false;SS('users',u)}render()}

// ============ BOOT ============
init();
restore();
</script>
</body>
</html>
