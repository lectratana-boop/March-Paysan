<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket - Marketplace Madagascar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--bg4:#252550;
  --primary:#7c5cfc;--primary2:#9b7dff;--secondary:#00cec9;
  --success:#00b894;--warning:#fdcb6e;--danger:#e17055;
  --text:#e8e8ff;--text2:#a0a0c0;--gold:#ffd700;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.3);
}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
button{cursor:pointer;border:none;border-radius:var(--radius);padding:10px 20px;font-size:14px;font-weight:600;transition:.3s;font-family:inherit}
button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
input,textarea,select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px;color:var(--text);font-size:14px;width:100%;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 10px rgba(124,92,252,.3)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#5a3fd4);color:#fff}
.btn-success{background:linear-gradient(135deg,var(--success),#00a381);color:#fff}
.btn-danger{background:linear-gradient(135deg,var(--danger),#d63031);color:#fff}
.btn-warning{background:linear-gradient(135deg,var(--warning),#f0b429);color:#222}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#00a8a3);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-block{width:100%}
.hidden{display:none!important}
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:.3s}
.card:hover{border-color:var(--primary);box-shadow:0 0 15px rgba(124,92,252,.1)}
.badge{background:var(--danger);color:#fff;border-radius:50%;font-size:10px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-pending{background:rgba(253,203,110,.15);color:var(--warning)}
.tag-approved{background:rgba(0,184,148,.15);color:var(--success)}
.tag-rejected{background:rgba(225,112,85,.15);color:var(--danger)}
.tag-banned{background:rgba(225,112,85,.25);color:var(--danger);border:1px solid var(--danger)}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.text-center{text-align:center}
.mb-2{margin-bottom:16px}
.mt-2{margin-top:16px}

/* AUTH */
#auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a 0%,#1a1040 50%,#0a0a1a 100%);padding:20px}
.auth-container{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.auth-container h1{text-align:center;margin-bottom:8px;background:linear-gradient(135deg,var(--primary2),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px}
.auth-container .subtitle{text-align:center;color:var(--text2);margin-bottom:24px;font-size:14px}
.auth-tabs{display:flex;margin-bottom:20px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--bg4)}
.auth-tab{flex:1;padding:12px;text-align:center;background:var(--bg);color:var(--text2);cursor:pointer;font-weight:600;transition:.3s}
.auth-tab.active{background:var(--primary);color:#fff}
.auth-message{padding:12px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;text-align:center;line-height:1.5}
.auth-message.success{background:rgba(0,184,148,.15);color:var(--success);border:1px solid var(--success)}
.auth-message.error{background:rgba(225,112,85,.15);color:var(--danger);border:1px solid var(--danger)}
.auth-message.warning{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid var(--warning)}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}

/* TOP NOTIFICATION BAR */
#top-notification-bar{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(90deg,#e17055,#fdcb6e,#e17055);background-size:200% 100%;animation:barSlide 3s linear infinite;padding:12px 20px;text-align:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(225,112,85,.4)}
@keyframes barSlide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
#top-notification-bar:hover{filter:brightness(1.1)}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--bg4);padding:0 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
header.has-topbar{top:48px}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--primary2),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--text2);padding:8px 14px;font-size:13px;border-radius:8px;position:relative;white-space:nowrap}
nav button:hover{background:var(--bg3);color:var(--text);transform:none}
nav button.active{background:var(--primary);color:#fff}
nav button .nav-badge{position:absolute;top:-4px;right:-4px}
.header-right{display:flex;align-items:center;gap:12px}
.header-user{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:24px}
.page-title{font-size:24px;font-weight:700;margin-bottom:4px}
.page-subtitle{color:var(--text2);font-size:14px;margin-bottom:20px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .stat-icon{font-size:32px;margin-bottom:8px}
.stat-card .stat-value{font-size:32px;font-weight:800;margin-bottom:4px}
.stat-card .stat-label{color:var(--text2);font-size:13px}
.stat-card.purple .stat-icon,.stat-card.purple .stat-value{color:var(--primary2)}
.stat-card.teal .stat-icon,.stat-card.teal .stat-value{color:var(--secondary)}
.stat-card.green .stat-icon,.stat-card.green .stat-value{color:var(--success)}
.stat-card.gold .stat-icon,.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.red .stat-icon,.stat-card.red .stat-value{color:var(--danger)}

/* ADMIN TABS */
.admin-tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--bg4);padding-bottom:8px}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:10px 16px;border-radius:8px 8px 0 0;background:transparent;color:var(--text2);font-size:13px;font-weight:600;transition:.3s;white-space:nowrap;position:relative}
.admin-tab:hover{background:var(--bg3);color:var(--text);transform:none}
.admin-tab.active{background:var(--bg3);color:var(--primary2);border-bottom:2px solid var(--primary)}
.admin-tab .badge{margin-left:6px}

/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--bg4);font-size:13px}
th{color:var(--text2);font-weight:600;background:var(--bg3);white-space:nowrap}
tr:hover td{background:rgba(124,92,252,.05)}

/* PRODUCTS */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.product-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);overflow:hidden;transition:.3s}
.product-card:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow)}
.product-img{height:150px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text2);position:relative}
.product-info{padding:16px}
.product-info h3{font-size:16px;margin-bottom:4px}
.product-info .price{color:var(--secondary);font-size:20px;font-weight:800;margin:8px 0}
.product-info .seller{color:var(--text2);font-size:12px}

/* FORUM */
.post-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.post-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.post-content{margin-bottom:16px;line-height:1.6}
.comment{background:var(--bg3);border-radius:8px;padding:12px;margin:8px 0 8px 20px;border-left:3px solid var(--primary)}
.comment-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}

/* PROFILE */
.profile-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:40px;text-align:center;max-width:600px;margin:0 auto}
.profile-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin:0 auto 16px;color:#fff}
.stars-progress{background:var(--bg);border-radius:20px;height:24px;overflow:hidden;margin:16px 0}
.stars-progress-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--gold));transition:.5s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;min-width:40px;color:#fff}
.withdraw-glow{animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 10px var(--gold)}50%{box-shadow:0 0 30px var(--gold),0 0 60px rgba(255,215,0,.4)}}

/* MEGA WHEEL */
#wheel-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,26,.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.wheel-container{text-align:center;max-width:500px}
.wheel-title{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--warning));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.wheel-subtitle{color:var(--text2);margin-bottom:24px}
.wheel-stage{position:relative;display:inline-block}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--gold);z-index:10;filter:drop-shadow(0 2px 8px rgba(255,215,0,.6))}
canvas{border-radius:50%;box-shadow:0 0 40px rgba(124,92,252,.3)}
.wheel-result{margin-top:20px;font-size:18px;color:var(--gold);font-weight:700;min-height:30px}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;width:10px;height:10px;z-index:10000;animation:confettiFall 3s ease-in-out forwards}

/* RESPONSIVE */
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .product-grid{grid-template-columns:1fr}
  main{padding:16px}
  .auth-container{padding:24px}
  .header-inner{gap:4px}
  nav button{font-size:11px;padding:6px 10px}
  .logo{font-size:16px}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
</style>
</head>
<body>

<!-- ============ AUTH PAGE ============ -->
<div id="auth-page">
  <div class="auth-container">
    <h1><i class="fas fa-store"></i> MadaMarket</h1>
    <p class="subtitle">Marketplace Madagascar</p>
    <div id="auth-message"></div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">Connexion</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">Inscription</div>
    </div>
    
    <!-- LOGIN -->
    <div id="login-form">
      <label><i class="fas fa-phone"></i> Téléphone</label>
      <input type="tel" id="login-phone" placeholder="034 XX XXX XX">
      <label><i class="fas fa-lock"></i> Mot de passe</label>
      <input type="password" id="login-password" placeholder="Votre mot de passe">
      <button class="btn-primary btn-block" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Se Connecter
      </button>
    </div>
    
    <!-- REGISTER -->
    <div id="register-form" class="hidden">
      <label><i class="fas fa-user"></i> Nom complet *</label>
      <input type="text" id="reg-name" placeholder="Nom complet">
      <label><i class="fas fa-phone"></i> Téléphone *</label>
      <input type="tel" id="reg-phone" placeholder="034 XX XXX XX">
      <label><i class="fas fa-lock"></i> Mot de passe *</label>
      <input type="password" id="reg-password" placeholder="Créer un mot de passe">
      <label><i class="fas fa-map-marker-alt"></i> Ville *</label>
      <input type="text" id="reg-city" placeholder="Ville">
      <label><i class="fas fa-home"></i> Quartier *</label>
      <input type="text" id="reg-quartier" placeholder="Quartier">
      <button class="btn-primary btn-block" onclick="handleRegister()">
        <i class="fas fa-user-plus"></i> S'inscrire
      </button>
    </div>

    <div style="margin-top:16px;text-align:center">
      <button class="btn-danger btn-sm" onclick="resetSite()" style="opacity:.5">
        <i class="fas fa-trash"></i> Réinitialiser le site
      </button>
    </div>
  </div>
</div>

<!-- ============ TOP NOTIFICATION BAR ============ -->
<div id="top-notification-bar" class="hidden"></div>

<!-- ============ MAIN APP ============ -->
<div id="main-app" class="hidden">
  <header id="main-header">
    <div class="header-inner">
      <div class="logo"><i class="fas fa-store"></i> MadaMarket</div>
      <nav id="main-nav"></nav>
      <div class="header-right">
        <div class="header-stars">
          <i class="fas fa-star" style="color:var(--gold)"></i>
          <span id="header-stars">0</span>
        </div>
        <div class="header-user">
          <div class="avatar" id="header-avatar">A</div>
          <span id="header-name">User</span>
        </div>
        <button class="btn-danger btn-sm" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content"></main>
</div>

<!-- ============ WHEEL OVERLAY ============ -->
<div id="wheel-overlay" class="hidden">
  <div class="wheel-container">
    <div class="wheel-title"><i class="fas fa-trophy"></i> MEGA WHEEL</div>
    <div class="wheel-subtitle">Jackpot de 20 étoiles!</div>
    <div class="wheel-stage">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="400" height="400"></canvas>
    </div>
    <div class="wheel-result" id="wheel-result"></div>
  </div>
</div>

<script>
// ============================================================
// DATABASE FUNCTIONS (Direct localStorage access)
// ============================================================
const DB = {
  users: () => JSON.parse(localStorage.getItem('u') || '[]'),
  saveUsers: (data) => localStorage.setItem('u', JSON.stringify(data)),
  products: () => JSON.parse(localStorage.getItem('p') || '[]'),
  saveProducts: (data) => localStorage.setItem('p', JSON.stringify(data)),
  posts: () => JSON.parse(localStorage.getItem('po') || '[]'),
  savePosts: (data) => localStorage.setItem('po', JSON.stringify(data)),
  comments: () => JSON.parse(localStorage.getItem('c') || '[]'),
  saveComments: (data) => localStorage.setItem('c', JSON.stringify(data)),
  orders: () => JSON.parse(localStorage.getItem('o') || '[]'),
  saveOrders: (data) => localStorage.setItem('o', JSON.stringify(data)),
  history: () => JSON.parse(localStorage.getItem('h') || '[]'),
  saveHistory: (data) => localStorage.setItem('h', JSON.stringify(data)),
  session: () => localStorage.getItem('session'),
  setSession: (id) => localStorage.setItem('session', id)
};

// ============================================================
// PENDING FUNCTION - Always reads directly from localStorage
// ============================================================
function pending() {
  const users = DB.users();
  const products = DB.products();
  const comments = DB.comments();
  const orders = DB.orders();
  
  const reg = users.filter(u => u.status === 'pending' && u.role !== 'admin' && !u.ban).length;
  const prod = products.filter(p => p.status === 'pending').length;
  const cmt = comments.filter(c => c.status === 'pending').length;
  const ord = orders.filter(o => o.status === 'pending').length;
  const ban = users.filter(u => u.ban).length;
  
  return { reg, prod, cmt, ord, ban, total: reg + prod + cmt + ord };
}

// ============================================================
// UTILITIES
// ============================================================
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
const esc = (str) => {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
};
const normalizePhone = (p) => (p || '').replace(/[\s\-\.]/g, '');
const formatDate = (d) => new Date(d).toLocaleDateString('fr-FR', {
  day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
});
const getCategoryIcon = (cat) => {
  const icons = {
    'Électronique': 'laptop', 'Vêtements': 'tshirt', 'Maison': 'home',
    'Alimentation': 'utensils', 'Services': 'handshake', 'Autre': 'box'
  };
  return icons[cat] || 'box';
};

// ============================================================
// INITIALIZE ADMIN
// ============================================================
function initAdmin() {
  let users = DB.users();
  if (!users.find(u => u.role === 'admin')) {
    users.push({
      id: 'admin001',
      name: 'Administrateur',
      phone: '0340000000',
      password: 'admin123',
      city: 'Antananarivo',
      quartier: 'Centre',
      role: 'admin',
      status: 'approved',
      stars: 0,
      ban: false,
      regAt: new Date().toISOString()
    });
    DB.saveUsers(users);
  }
}

// ============================================================
// SOUNDS
// ============================================================
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    osc.type = 'sine';
    gain.gain.value = 0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.stop(ctx.currentTime + 0.3);
  } catch (e) {}
}

function tick() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 400 + Math.random() * 400;
    osc.type = 'square';
    gain.gain.value = 0.1;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.02);
    osc.stop(ctx.currentTime + 0.02);
  } catch (e) {}
}

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentPage = 'accueil';
let currentAdminTab = 'notifications';
let lastTotal = -1;

// ============================================================
// NOTIFICATION SYSTEM - 300ms polling
// ============================================================
setInterval(() => {
  if (!currentUser || currentUser.role !== 'admin') return;
  
  const p = pending();
  
  if (p.total !== lastTotal) {
    lastTotal = p.total;
    updateTopBar(p);
    updateNavBadges();
    if (currentPage === 'admin') {
      draw();
    }
    if (p.total > 0) {
      beep();
    }
  }
}, 300);

// Storage event listener for cross-tab
window.addEventListener('storage', (e) => {
  if (currentUser && currentUser.role === 'admin' && e.key && e.key.startsWith('u')) {
    const p = pending();
    if (p.total !== lastTotal) {
      lastTotal = p.total;
      updateTopBar(p);
      updateNavBadges();
      beep();
      if (currentPage === 'admin') draw();
    }
  }
});

function updateTopBar(p) {
  const bar = document.getElementById('top-notification-bar');
  const header = document.getElementById('main-header');
  
  if (!currentUser || currentUser.role !== 'admin' || p.total === 0) {
    bar.classList.add('hidden');
    header.classList.remove('has-topbar');
    return;
  }
  
  let parts = [];
  if (p.reg) parts.push(`👤 ${p.reg} inscription(s)`);
  if (p.prod) parts.push(`📦 ${p.prod} produit(s)`);
  if (p.cmt) parts.push(`💬 ${p.cmt} commentaire(s)`);
  if (p.ord) parts.push(`🛒 ${p.ord} commande(s)`);
  
  bar.innerHTML = `🔔 ${parts.join(' • ')} - CLIQUEZ POUR GÉRER`;
  bar.onclick =
