<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaMarket - Marketplace Madagascar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3e;--bg4:#252550;
  --primary:#7c5cfc;--primary2:#9b7dff;--secondary:#00cec9;
  --success:#00b894;--warning:#fdcb6e;--danger:#e17055;
  --text:#e8e8ff;--text2:#a0a0c0;--gold:#ffd700;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--secondary);text-decoration:none}
button{cursor:pointer;border:none;border-radius:var(--radius);padding:10px 20px;font-size:14px;font-weight:600;transition:.3s}
button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
input,textarea,select{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-size:14px;width:100%;margin-bottom:12px;transition:.3s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 10px rgba(124,92,252,.3)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#5a3fd4);color:#fff}
.btn-success{background:linear-gradient(135deg,var(--success),#00a381);color:#fff}
.btn-danger{background:linear-gradient(135deg,var(--danger),#d63031);color:#fff}
.btn-warning{background:linear-gradient(135deg,var(--warning),#f0b429);color:#222}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#00a8a3);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-block{width:100%;display:block}
.hidden{display:none!important}
.badge{background:var(--danger);color:#fff;border-radius:50%;font-size:11px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:.3s}
.card:hover{border-color:var(--primary);box-shadow:0 0 20px rgba(124,92,252,.15)}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-pending{background:rgba(253,203,110,.15);color:var(--warning)}
.tag-approved{background:rgba(0,184,148,.15);color:var(--success)}
.tag-sold{background:rgba(124,92,252,.15);color:var(--primary2)}
.tag-rejected{background:rgba(225,112,85,.15);color:var(--danger)}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.text-center{text-align:center}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.stars-display{color:var(--gold)}

/* ===== AUTH ===== */
#auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a1a 0%,#1a1040 50%,#0a0a1a 100%)}
.auth-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:40px;width:100%;max-width:440px;box-shadow:var(--shadow)}
.auth-box h1{text-align:center;margin-bottom:8px;background:linear-gradient(135deg,var(--primary2),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px}
.auth-box .sub{text-align:center;color:var(--text2);margin-bottom:24px;font-size:14px}
.auth-tabs{display:flex;margin-bottom:24px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--bg4)}
.auth-tabs div{flex:1;padding:12px;text-align:center;background:var(--bg);color:var(--text2);cursor:pointer;font-weight:600;transition:.3s}
.auth-tabs div.active{background:var(--primary);color:#fff}
.auth-msg{padding:12px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;text-align:center}
.auth-msg.ok{background:rgba(0,184,148,.15);color:var(--success);border:1px solid rgba(0,184,148,.3)}
.auth-msg.err{background:rgba(225,112,85,.15);color:var(--danger);border:1px solid rgba(225,112,85,.3)}
.auth-msg.warn{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid rgba(253,203,110,.3)}

/* ===== HEADER ===== */
header{background:var(--bg2);border-bottom:1px solid var(--bg4);padding:0 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.hdr{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--primary2),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--text2);padding:8px 14px;font-size:12px;border-radius:8px;position:relative;white-space:nowrap}
.nav button:hover{background:var(--bg3);color:var(--text);transform:none}
.nav button.active{background:var(--primary);color:#fff}
.nav button .nbadge{position:absolute;top:0;right:0;font-size:9px;min-width:16px;height:16px;background:var(--danger);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hdr-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hdr-user{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff}
.bell-btn{position:relative;background:transparent;color:var(--text2);font-size:18px;padding:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.bell-btn:hover{background:var(--bg3);color:var(--text)}
.bell-btn .badge{position:absolute;top:0;right:0;font-size:9px;min-width:16px;height:16px}

/* ===== MAIN ===== */
main{max-width:1400px;margin:0 auto;padding:24px}
.pg-title{font-size:22px;font-weight:700;margin-bottom:4px}
.pg-sub{color:var(--text2);font-size:13px;margin-bottom:24px}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.st{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:18px;text-align:center;transition:.3s}
.st:hover{border-color:var(--primary)}
.st .ico{font-size:24px;margin-bottom:6px}
.st .val{font-size:26px;font-weight:800;margin-bottom:4px}
.st .lbl{color:var(--text2);font-size:12px}
.st.purple .ico,.st.purple .val{color:var(--primary2)}
.st.teal .ico,.st.teal .val{color:var(--secondary)}
.st.green .ico,.st.green .val{color:var(--success)}
.st.gold .ico,.st.gold .val{color:var(--gold)}
.st.red .ico,.st.red .val{color:var(--danger)}

/* ===== ADMIN TABS ===== */
.atabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--bg4);padding-bottom:8px}
.atabs::-webkit-scrollbar{display:none}
.atab{padding:10px 16px;border-radius:8px 8px 0 0;background:transparent;color:var(--text2);font-size:12px;font-weight:600;transition:.3s;white-space:nowrap;position:relative}
.atab:hover{background:var(--bg3);color:var(--text);transform:none}
.atab.active{background:var(--bg3);color:var(--primary2);border-bottom:2px solid var(--primary)}
.atab .badge{margin-left:4px;font-size:9px;min-width:16px;height:16px}

/* ===== TABLE ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bg4);font-size:12px}
th{color:var(--text2);font-weight:600;background:var(--bg3);white-space:nowrap}
tr:hover td{background:rgba(124,92,252,.04)}

/* ===== PRODUCTS ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);overflow:hidden;transition:.3s}
.pcard:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow)}
.pimg{height:140px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--text2);position:relative}
.pinfo{padding:14px}
.pinfo h3{font-size:14px;margin-bottom:4px}
.pinfo .price{color:var(--secondary);font-size:18px;font-weight:800;margin:6px 0}
.pinfo .seller{color:var(--text2);font-size:11px}

/* ===== FORUM ===== */
.post{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.post-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-body{color:var(--text);line-height:1.6;margin-bottom:14px;font-size:14px}
.cmt{background:var(--bg3);border-radius:8px;padding:10px;margin:6px 0 6px 20px;border-left:3px solid var(--primary);font-size:13px}
.cmt-hd{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}

/* ===== PROFILE ===== */
.prof{background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;padding:36px;text-align:center;max-width:600px;margin:0 auto}
.prof-av{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 14px;color:#fff}
.progress-bar{background:var(--bg);border-radius:20px;height:22px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--gold));transition:.5s;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;min-width:35px;color:#fff}

/* ===== ROULETTE ===== */
#roulette-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,26,.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rl-title{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--warning));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.rl-sub{color:var(--text2);margin-bottom:24px;font-size:14px}
.rl-wheel{position:relative;height:300px;overflow:hidden;border:2px solid var(--gold);border-radius:var(--radius);background:var(--bg2);margin-bottom:20px;width:100%;max-width:400px}
.rl-pointer{position:absolute;top:50%;left:0;right:0;height:50px;margin-top:-25px;background:rgba(255,215,0,.1);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);z-index:2;pointer-events:none}
.rl-names{position:absolute;top:0;left:0;right:0}
.rl-name{height:50px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--text);border-bottom:1px solid var(--bg4)}
.rl-name.win{background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(124,92,252,.2));color:var(--gold);font-size:20px}
.rl-result{font-size:18px;color:var(--gold);font-weight:700;animation:pulse 1s infinite}
.rl-timer{background:var(--bg3);border-radius:var(--radius);padding:14px;margin-bottom:14px;font-size:13px;color:var(--text2)}
.rl-timer .time{font-size:32px;font-weight:800;color:var(--secondary);display:block;margin-top:6px;font-family:monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;z-index:10000;animation:confetti 3s ease-in-out forwards}

/* ===== NOTIF DROPDOWN ===== */
.ndrop{position:absolute;top:calc(100% + 8px);right:-20px;width:340px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);box-shadow:var(--shadow);z-index:200;max-height:480px;overflow-y:auto}
.ndrop h3{padding:14px 16px;border-bottom:1px solid var(--bg4);font-size:14px;margin:0}
.nitem{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.2s}
.nitem:hover{background:var(--bg3)}
.nico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.nico.blue{background:rgba(124,92,252,.2);color:var(--primary2)}
.nico.green{background:rgba(0,184,148,.2);color:var(--success)}
.nico.orange{background:rgba(253,203,110,.2);color:var(--warning)}
.nico.red{background:rgba(225,112,85,.2);color:var(--danger)}
.ntxt{font-size:12px;line-height:1.4}
.ntxt small{color:var(--text2);display:block;margin-top:3px}

/* ===== WITHDRAWAL ===== */
.withdraw-glow{animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--gold)}50%{box-shadow:0 0 25px var(--gold),0 0 50px rgba(255,215,0,.3)}}

/* ===== DEMO BTN ===== */
.demo-btn{background:linear-gradient(135deg,var(--gold),#ff6b6b);color:#000;font-size:16px;padding:14px 28px;border-radius:16px;font-weight:800;animation:pulse 2s infinite;margin:20px auto;display:block}
.demo-btn:hover{transform:scale(1.05)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:1fr}
  main{padding:14px}
  .auth-box{margin:14px;padding:24px}
  .ndrop{right:-80px;width:290px}
  .hdr{padding:0 4px;gap:6px}
  .logo{font-size:16px}
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
</style>
</head>
<body>

<!-- ==================== AUTH ==================== -->
<div id="auth-page">
  <div class="auth-box">
    <h1><i class="fas fa-store"></i> MadaMarket</h1>
    <p class="sub">Marketplace Madagascar</p>
    <div id="auth-msg"></div>
    <div class="auth-tabs">
      <div class="active" onclick="authTab('login')">Connexion</div>
      <div onclick="authTab('register')">Inscription</div>
    </div>
    <div id="form-login">
      <label style="font-size:12px;color:var(--text2)">Email</label>
      <input type="email" id="l-email" placeholder="votre@email.com">
      <label style="font-size:12px;color:var(--text2)">Mot de passe</label>
      <input type="password" id="l-pass" placeholder="••••••••">
      <button class="btn-primary btn-block" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Se Connecter</button>
      <div style="margin-top:20px;padding:14px;background:var(--bg3);border-radius:var(--radius);font-size:12px;text-align:center">
        <div style="color:var(--warning);font-weight:700;margin-bottom:6px"><i class="fas fa-key"></i> Compte Admin</div>
        <div>Email: <code style="color:var(--secondary)">admin@mada.mg</code></div>
        <div>Mot de passe: <code style="color:var(--secondary)">admin123</code></div>
        <button class="btn-warning btn-xs mt-1" onclick="fillAdmin()">Remplir auto</button>
      </div>
    </div>
    <div id="form-register" class="hidden">
      <input type="text" id="r-name" placeholder="Nom complet *">
      <input type="email" id="r-email" placeholder="Email *">
      <input type="tel" id="r-phone" placeholder="Téléphone (+261...)">
      <input type="text" id="r-city" placeholder="Ville">
      <input type="password" id="r-pass" placeholder="Mot de passe *">
      <input type="password" id="r-pass2" placeholder="Confirmer mot de passe *">
      <button class="btn-primary btn-block" onclick="doRegister()"><i class="fas fa-user-plus"></i> S'inscrire</button>
    </div>
    <div style="margin-top:16px;text-align:center">
      <button class="btn-xs btn-danger" onclick="resetAll()" style="opacity:.5"><i class="fas fa-trash"></i> Reset données</button>
    </div>
  </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="app" class="hidden">
  <header>
    <div class="hdr">
      <div class="logo"><i class="fas fa-store"></i> MadaMarket</div>
      <div class="nav" id="main-nav"></div>
      <div class="hdr-right">
        <div style="white-space:nowrap"><i class="fas fa-star" style="color:var(--gold)"></i> <span id="hdr-stars">0</span></div>
        <div style="position:relative" id="bell-wrap">
          <button class="bell-btn" onclick="toggleNotif()">
            <i class="fas fa-bell"></i>
            <span class="badge hidden" id="bell-badge">0</span>
          </button>
          <div class="ndrop hidden" id="ndrop"></div>
        </div>
        <div class="hdr-user">
          <div class="avatar" id="hdr-av">A</div>
          <span id="hdr-name" style="font-size:13px">Admin</span>
        </div>
        <button class="btn-sm btn-danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </header>
  <main id="content"></main>
</div>

<!-- ==================== ROULETTE OVERLAY ==================== -->
<div id="roulette-overlay" class="hidden">
  <div style="text-align:center;width:100%;max-width:420px;padding:20px">
    <div class="rl-title"><i class="fas fa-trophy"></i> JACKPOT ROULETTE</div>
    <div class="rl-sub">20 Étoiles à gagner!</div>
    <div class="rl-wheel" id="rl-wheel">
      <div class="rl-pointer"></div>
      <div class="rl-names" id="rl-names"></div>
    </div>
    <div id="rl-status" style="font-size:16px;margin-top:14px"></div>
  </div>
</div>

<script>
// ============================================================
// STORAGE
// ============================================================
const S = {
  get(k) { try { return JSON.parse(localStorage.getItem('mm_'+k)) || []; } catch { return []; } },
  set(k,v) { localStorage.setItem('mm_'+k, JSON.stringify(v)); },
  getVal(k) { try { return JSON.parse(localStorage.getItem('mm_'+k)); } catch { return null; } },
  setVal(k,v) { localStorage.setItem('mm_'+k, JSON.stringify(v)); }
};
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }
function fdate(d) { return new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function mdTime() { const n=new Date(); return new Date(n.getTime()+n.getTimezoneOffset()*60000+3*3600000); }
function catIcon(c) { return {Électronique:'laptop',Vêtements:'tshirt',Maison:'home',Alimentation:'utensils',Services:'handshake'}[c]||'box'; }

// ============================================================
// INIT
// ============================================================
let CU = null; // current user
let curPage = 'accueil';
let curATab = 'notifs';

function initDB() {
  let u = S.get('users');
  // Always ensure admin exists with correct credentials
  const ai = u.findIndex(x => x.id === 'admin001' || x.role === 'admin');
  const admin = {
    id:'admin001', name:'Administrateur', email:'admin@mada.mg',
    phone:'+261340000000', city:'Antananarivo', password:'admin123',
    role:'admin', status:'approved', stars:0, isActive:true,
    withdrawReq:false, regAt:new Date().toISOString()
  };
  if (ai >= 0) { u[ai] = {...u[ai], ...admin, stars: u[ai].stars || 0}; }
  else { u.push(admin); }
  S.set('users', u);

  // Ensure arrays exist
  if (!localStorage.getItem('mm_products')) S.set('products',[]);
  if (!localStorage.getItem('mm_posts')) S.set('posts',[]);
  if (!localStorage.getItem('mm_comments')) S.set('comments',[]);
  if (!localStorage.getItem('mm_orders')) S.set('orders',[]);
  if (!localStorage.getItem('mm_rHistory')) S.set('rHistory',[]);
}

function resetAll() {
  if (!confirm('Supprimer TOUTES les données et recommencer?')) return;
  Object.keys(localStorage).forEach(k => { if(k.startsWith('mm_')) localStorage.removeItem(k); });
  location.reload();
}

function fillAdmin() {
  document.getElementById('l-email').value = 'admin@mada.mg';
  document.getElementById('l-pass').value = 'admin123';
}

// ============================================================
// AUTH
// ============================================================
function authTab(t) {
  document.querySelectorAll('.auth-tabs div').forEach((d,i) => d.classList.toggle('active', (t==='login'?i===0:i===1)));
  document.getElementById('form-login').classList.toggle('hidden', t!=='login');
  document.getElementById('form-register').classList.toggle('hidden', t!=='register');
  document.getElementById('auth-msg').innerHTML = '';
}

function authMsg(m,t) { document.getElementById('auth-msg').innerHTML=`<div class="auth-msg ${t}">${m}</div>`; }

function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pw = document.getElementById('l-pass').value;
  if (!email||!pw) return authMsg('Remplissez tous les champs','err');

  const users = S.get('users');
  const u = users.find(x => x.email===email && x.password===pw);
  if (!u) return authMsg('Email ou mot de passe incorrect','err');
  if (u.status==='pending') return authMsg('⏳ Votre compte est en attente de validation par l\'administrateur','warn');
  if (u.status==='rejected') return authMsg('❌ Votre inscription a été refusée','err');

  u.isActive = true;
  S.set('users', users);
  CU = u;
  S.setVal('session', u.id);
  document.getElementById('auth-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderAll();
}

function doRegister() {
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const city=document.getElementById('r-city').value.trim();
  const pw=document.getElementById('r-pass').value;
  const pw2=document.getElementById('r-pass2').value;

  if (!name||!email||!pw) return authMsg('Remplissez les champs obligatoires (*)','err');
  if (pw!==pw2) return authMsg('Les mots de passe ne correspondent pas','err');
  if (pw.length<4) return authMsg('Mot de passe trop court (min 4 caractères)','err');

  let users = S.get('users');
  if (users.find(x=>x.email===email)) return authMsg('Cet email est déjà utilisé','err');

  users.push({
    id:uid(), name, email, phone:phone||'', city:city||'', password:pw,
    role:'user', status:'pending', stars:0, isActive:false,
    withdrawReq:false, regAt:new Date().toISOString()
  });
  S.set('users', users);

  authMsg('✅ Inscription réussie! Votre compte est en attente de validation par l\'administrateur. Revenez plus tard.','ok');
  ['r-name','r-email','r-phone','r-city','r-pass','r-pass2'].forEach(id=>document.getElementById(id).value='');
}

function doLogout() {
  if (CU) {
    let u = S.get('users');
    let x = u.find(a=>a.id===CU.id);
    if (x) { x.isActive=false; S.set('users',u); }
  }
  CU=null; S.setVal('session',null);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-page').classList.remove('hidden');
  document.getElementById('auth-msg').innerHTML='';
  document.getElementById('l-email').value='';
  document.getElementById('l-pass').value='';
}

function restoreSession() {
  const sid = S.getVal('session');
  if (!sid) return;
  const users = S.get('users');
  const u = users.find(x=>x.id===sid);
  if (u && u.status==='approved') {
    u.isActive=true; S.set('users',users);
    CU=u;
    document.getElementById('auth-page').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderAll();
  }
}

// ============================================================
// PENDING COUNTS (for admin)
// ============================================================
function pending() {
  const u=S.get('users'), p=S.get('products'), c=S.get('comments'), o=S.get('orders');
  return {
    reg: u.filter(x=>x.status==='pending'&&x.role!=='admin').length,
    prod: p.filter(x=>x.status==='pending').length,
    cmt: c.filter(x=>x.status==='pending').length,
    ord: o.filter(x=>x.status==='pending').length,
    wdr: u.filter(x=>x.withdrawReq).length,
    get total() { return this.reg+this.prod+this.cmt+this.ord+this.wdr; }
  };
}

// ============================================================
// NAVIGATION
// ============================================================
function buildNav() {
  const isAdmin = CU && CU.role==='admin';
  const p = isAdmin ? pending() : {total:0};
  let tabs = [
    {id:'accueil',icon:'home',label:'Accueil'},
    {id:'produits',icon:'box',label:'Produits'},
    {id:'forum',icon:'comments',label:'Forum'},
    {id:'profil',icon:'user',label:'Profil'},
    {id:'roulette',icon:'dice',label:'Roulette'},
  ];
  if (isAdmin) tabs.push({id:'admin',icon:'shield-alt',label:'Admin',badge:p.total});

  let h = '';
  tabs.forEach(t => {
    h += `<button class="${curPage===t.id?'active':''}" onclick="goPage('${t.id}')"><i class="fas fa-${t.icon}"></i> ${t.label}`;
    if (t.badge && t.badge > 0) h += `<span class="nbadge">${t.badge}</span>`;
    h += '</button>';
  });
  document.getElementById('main-nav').innerHTML = h;
}

function goPage(p) {
  curPage=p;
  document.getElementById('ndrop').classList.add('hidden');
  renderAll();
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  if (!CU) return;
  // Refresh user from DB
  const users = S.get('users');
  const fresh = users.find(x=>x.id===CU.id);
  if (fresh) { CU.stars=fresh.stars; CU.withdrawReq=fresh.withdrawReq; }

  document.getElementById('hdr-av').textContent = CU.name.charAt(0).toUpperCase();
  document.getElementById('hdr-name').textContent = CU.name;
  document.getElementById('hdr-stars').textContent = CU.stars||0;

  const isAdmin = CU.role==='admin';
  document.getElementById('bell-wrap').style.display = isAdmin?'block':'none';

  if (isAdmin) {
    const p = pending();
    const bb = document.getElementById('bell-badge');
    if (p.total>0) { bb.textContent=p.total; bb.classList.remove('hidden'); }
    else { bb.classList.add('hidden'); }
  }

  buildNav();
  const ct = document.getElementById('content');

  switch(curPage) {
    case 'accueil': renderAccueil(ct); break;
    case 'produits': renderProduits(ct); break;
    case 'forum': renderForum(ct); break;
    case 'profil': renderProfil(ct); break;
    case 'roulette': renderRoulette(ct); break;
    case 'admin': renderAdmin(ct); break;
    default: renderAccueil(ct);
  }
}

function toggleEl(id) { document.getElementById(id).classList.toggle('hidden'); }

function addProduct() {
  const name=document.getElementById('p-name').value.trim();
  const desc=document.getElementById('p-desc').value.trim();
  const price=document.getElementById('p-price').value;
  const cat=document.getElementById('p-cat').value;
  if (!name||!price) return alert('Nom et prix requis!');

  let prods = S.get('products');
  prods.push({id:uid(), userId:CU.id, name, description:desc, price:Number(price), category:cat||'Autre', status:'pending', createdAt:new Date().toISOString()});
  S.set('products', prods);
  alert('✅ Produit soumis! En attente de validation par l\'admin.');
  renderAll();
}

function buyProd(pid) {
  const prods=S.get('products');
  const p=prods.find(x=>x.id===pid);
  if (!p||p.userId===CU.id) return;
  if (!confirm(`Acheter "${p.name}" pour ${Number(p.price).toLocaleString()} Ar ?`)) return;

  let orders=S.get('orders');
  orders.push({id:uid(), productId:pid, buyerId:CU.id, sellerId:p.userId, productName:p.name, price:p.price, status:'pending', createdAt:new Date().toISOString()});
  S.set('orders', orders);
  alert('✅ Commande passée! En attente d\'approbation admin.');
  renderAll();
}

  h += '</div></div>';
  ct.innerHTML = h;
  updateCD();
}

function updateCD() {
  const now = mdTime();
  const m = 59-now.getMinutes(), s = 59-now.getSeconds();
  const el = document.getElementById('rl-cd');
  if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
setInterval(updateCD, 1000);

// Auto-roulette check
setInterval(() => {
  const now = mdTime();
  if (now.getMinutes()===0 && now.getSeconds()===0) {
    const last = S.getVal('lastRL');
    if (last !== now.getHours()) {
      S.setVal('lastRL', now.getHours());
      if (CU) startRoulette();
    }
  }
}, 1000);

let rlRunning = false;
function startRoulette() {
  const users = S.get('users').filter(u=>u.role!=='admin' && u.status==='approved');
  if (users.length < 1) return alert('Pas assez de membres actifs!');
  if (rlRunning) return;
  rlRunning = true;

  // Disable ALL buttons
  document.querySelectorAll('button').forEach(b=>b.disabled=true);

  const winner = users[Math.floor(Math.random()*users.length)];

  const ov = document.getElementById('roulette-overlay');
  const nd = document.getElementById('rl-names');
  const st = document.getElementById('rl-status');
  ov.classList.remove('hidden');
  st.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Tirage en cours...';

  // Build names
  let names = [];
  for (let i=0; i<80; i++) names.push(users[i%users.length]);
  const winPos = names.length - 6;
  names[winPos] = winner;

  nd.innerHTML = names.map((u,i)=>`<div class="rl-name" data-i="${i}">${esc(u.name)}</div>`).join('');

  const target = winPos*50 - 125;
  const start = Date.now();
  const dur = 7000;

  function anim() {
    const t = Math.min(1, (Date.now()-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    nd.style.transform = `translateY(-${e*target}px)`;
    if (t<1) { requestAnimationFrame(anim); }
    else {
      setTimeout(() => {
        const we = nd.querySelector(`[data-i="${winPos}"]`);
        if (we) we.classList.add('win');
        st.innerHTML = `<div class="rl-result">🎉🎉🎉<br>${esc(winner.name)}<br>gagne 20 étoiles!<br>🎉🎉🎉</div>`;

        // Award stars
        let all = S.get('users');
        let w = all.find(u=>u.id===winner.id);
        if (w) { w.stars=(w.stars||0)+20; S.set('users',all); }
        if (CU && CU.id===winner.id) { CU.stars=(CU.stars||0)+20; }

        // History
        let hist = S.get('rHistory');
        hist.push({id:winner.id, name:winner.name, stars:20, time:new Date().toISOString()});
        S.set('rHistory', hist);

        launchConfetti();

        setTimeout(() => {
          ov.classList.add('hidden');
          rlRunning=false;
          document.querySelectorAll('button').forEach(b=>b.disabled=false);
          renderAll();
        }, 5000);
      }, 500);
    }
  }
  requestAnimationFrame(anim);
}

function launchConfetti() {
  const cols=['#ffd700','#7c5cfc','#00cec9','#e17055','#00b894','#fd79a8','#6c5ce7'];
  for (let i=0;i<60;i++) {
    const el=document.createElement('div');
    el.className='confetti';
    el.style.cssText=`left:${Math.random()*100}vw;width:${5+Math.random()*10}px;height:${5+Math.random()*10}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'0'};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  }
}

    h += '<h3 class="mb-2" style="color:var(--warning)"><i class="fas fa-money-bill-wave"></i> Demandes de retrait</h3>';
    wdrs.forEach(u => {
      h += `<div class="card flex-between" style="border-left:4px solid var(--gold)"><div class="flex"><div class="avatar">${u.name.charAt(0)}</div><div><strong>${esc(u.name)}</strong><div style="color:var(--text2);font-size:11px">${esc(u.email)} | ${esc(u.phone||'-')}</div><div class="stars-display"><i class="fas fa-star"></i> ${u.stars||0} étoiles</div></div></div><div class="flex"><button class="btn-success btn-sm" onclick="aWdr('${u.id}','approve')"><i class="fas fa-check"></i> Valider Retrait</button><button class="btn-danger btn-sm" onclick="aWdr('${u.id}','reject')"><i class="fas fa-times"></i> Refuser</button></div></div>`;
    });
  }

  h += '<h3 class="mt-3 mb-2">Classement complet</h3>';
  h += '<div class="tw"><table><tr><th>Rang</th><th>Membre</th><th>Étoiles</th><th>Progression</th><th>Retrait</th></tr>';
  sorted.forEach((u,i) => {
    const pct = Math.min(100,((u.stars||0)/1000)*100);
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    h += `<tr>
      <td style="font-weight:700;font-size:${i<3?'18px':'13px'}">${medal}</td>
      <td><div class="flex"><div class="avatar" style="width:28px;height:28px;font-size:11px">${u.name.charAt(0)}</div><strong>${esc(u.name)}</strong></div></td>
      <td><span class="stars-display" style="font-size:15px;font-weight:700"><i class="fas fa-star"></i> ${u.stars||0}</span></td>
      <td><div class="progress-bar" style="height:14px;width:140px;display:inline-block"><div class="progress-fill" style="width:${pct}%;font-size:8px">${Math.round(pct)}%</div></div></td>
      <td>${u.withdrawReq?'<span class="tag tag-pending">⏳ En cours</span>':(u.stars||0)>=1000?'<span class="tag tag-approved">✓ Éligible</span>':'-'}</td>
    </tr>`;
  });
  h += '</table></div>';
  el.innerHTML = h;
}

function aWdr(id, action) {
  if (action==='approve' && !confirm('Valider le retrait? Les étoiles seront remises à 0.')) return;
  let users=S.get('users');
  let u=users.find(x=>x.id===id);
  if (u) {
    if (action==='approve') { u.stars=0; u.withdrawReq=false; }
    else { u.withdrawReq=false; }
    S.set('users', users);
  }
  renderAll();
}

// ============================================================
// BOOT
// ============================================================
initDB();
restoreSession();
</script>
</body>
</html>
